apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pigeons-api-sync
  namespace: pigeons
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore

  target:
    name: pigeons-secrets
    creationPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgresql://{{ .PGSQL_USER }}:{{ .PGSQL_PASSWORD }}@{{ .PGSQL_HOST }}:5432/pigeons?schema=public"
        JWT_EXPIRES_IN: "7d"
        APP_PORT: "3000"
        NODE_ENV: "production"
        REDIS_URL: "redis://{{ .REDIS_HOST }}:{{ .REDIS_PORT }}"
        S3_ENDPOINT: "https://s3.churchlify.com"
        S3_REGION: "us-east-1"
        S3_BUCKET: "pigeons-data"
        S3_FORCE_PATH_STYLE: "true"
        S3_ACCESS_KEY: "{{ .MINIO_ACCESS_KEY }}"
        S3_SECRET_KEY: "{{ .MINIO_SECRET_KEY }}"
        S3_PORT: "9000"

  data:
    - secretKey: PGSQL_USER
      remoteRef:
        key: global-db-secrets
        property: PGSQL_USER

    - secretKey: PGSQL_PASSWORD
      remoteRef:
        key: global-db-secrets
        property: PGSQL_PASSWORD

    - secretKey: PGSQL_HOST
      remoteRef:
        key: global-db-secrets
        property: PGSQL_HOST

    - secretKey: REDIS_HOST
      remoteRef:
        key: global-db-secrets
        property: REDIS_HOST

    - secretKey: REDIS_PORT
      remoteRef:
        key: global-db-secrets
        property: REDIS_PORT

    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: global-db-secrets
        property: REDIS_PASSWORD

    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: global-db-secrets
        property: MINIO_ACCESS_KEY

    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: global-db-secrets
        property: MINIO_SECRET_KEY
