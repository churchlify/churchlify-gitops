apiVersion: v1
kind: ConfigMap
metadata:
  name: mailu-config
  namespace: mailu
data: # Fixed typo: was 'ddata'
  # --- Standard Config ---
  DOMAIN: "churchlify.com"
  HOSTNAMES: "mail.churchlify.com,mailadmin.churchlify.com"
  TLS_FLAVOR: "notls"
  
  # --- Service Discovery ---
  ADMIN_ADDRESS: "mailu-admin"
  ANTISPAM_ADDRESS: "mailu-rspamd:11334"
  IMAP_ADDRESS: "mailu-dovecot:143"
  SMTP_ADDRESS: "mailu-smtp:25"
  REDIS_ADDRESS: "redis.platform.svc.cluster.local:6379"

  # --- The Syntax Fixers (Line 147 Fix) ---
  WEBMAIL_ADDRESS: "localhost"
  API_ADDRESS: "localhost"
  WELCOME_ADDRESS: "localhost"
  WEBSOCKET_ADDRESS: "localhost"

  # --- Pathing & Identity ---
  WEBROOT: "/"
  WEB_ADMIN: "/admin"
  SITENAME: "Churchlify Mail"