apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailu-mail-pvc
  namespace: mailu
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailu-data-pvc
  namespace: mailu
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources: { requests: { storage: 5Gi } }
---
# New: Required for Postfix mail queue
