apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailu-web
  namespace: mailu
  annotations:  
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Removing the manual snippet to see if Argo validates the simple version first
spec:
  ingressClassName: nginx # Use this instead of the annotation
  tls:
    - hosts:
        - mail.churchlify.com
        - mailadmin.churchlify.com
      secretName: mailu-tls
  rules:
    - host: mail.churchlify.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailu-front
                port:
                  number: 80
    - host: mailadmin.churchlify.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailu-front
                port:
                  number: 80