apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailu-front
  namespace: mailu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailu-front
  template:
    metadata:
      labels:
        app: mailu-front
    spec:
      containers:
        - name: front
          image: ghcr.io/mailu/nginx:2.0
          # REMOVE volumeMounts for the config file
          # ADD envFrom to inject the ConfigMap keys as variables
          envFrom:
            - configMapRef:
                name: mailu-config
          ports:
            - containerPort: 80
            - containerPort: 443
            - containerPort: 25
            - containerPort: 465
            - containerPort: 587
            - containerPort: 143
            - containerPort: 993
      # REMOVE the config volume from the volumes list if not used elsewhere