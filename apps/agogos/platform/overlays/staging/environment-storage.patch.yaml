apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agogos-platform-runtime
spec:
  target:
    template:
      data:
        DATABASE_URL: "postgresql://{{ .PGSQL_USER | urlquery }}:{{ .PGSQL_PASSWORD | urlquery }}@{{ .PGSQL_HOST }}:5432/agogos_staging?sslmode=disable"
        REDIS_URL: "redis://:{{ .REDIS_PASSWORD | urlquery }}@{{ .REDIS_HOST }}:{{ .REDIS_PORT }}/1"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agogos-database-bootstrap
spec:
  template:
    spec:
      containers:
        - name: database-bootstrap
          args:
            - |
              if [ "$(psql --dbname=postgres --tuples-only --no-align --command="SELECT 1 FROM pg_database WHERE datname = 'agogos_staging'")" != "1" ]; then
                createdb agogos_staging
              fi