apiVersion: v1
kind: Service
metadata:
  name: agogos-redis
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  selector:
    app.kubernetes.io/component: redis
    app.kubernetes.io/name: agogos-platform
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agogos-redis
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
      app.kubernetes.io/name: agogos-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
        app.kubernetes.io/name: agogos-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.6-alpine
          args:
            - redis-server
            - --appendonly
            - 'yes'
            - --maxmemory-policy
            - noeviction
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsGroup: 1000
            runAsUser: 999
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: data
        - emptyDir: {}
          name: tmp
