apiVersion: v1
kind: Service
metadata:
  name: agogos-postgres
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  selector:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/name: agogos-platform
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agogos-postgres
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  replicas: 1
  serviceName: agogos-postgres
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
      app.kubernetes.io/name: agogos-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        app.kubernetes.io/name: agogos-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
          args:
            - -c
            - shared_buffers=128MB
          envFrom:
            - secretRef:
                name: agogos-platform-runtime
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsGroup: 70
            runAsUser: 70
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/run/postgresql
              name: runtime
      volumes:
        - emptyDir: {}
          name: runtime
        - emptyDir: {}
          name: tmp
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
