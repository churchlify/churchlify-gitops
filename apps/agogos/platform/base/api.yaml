apiVersion: apps/v1
kind: Deployment
metadata:
  name: agogos-api
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: agogos-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/name: agogos-platform
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/name: agogos-platform
    spec:
      automountServiceAccountToken: false
      serviceAccountName: agogos-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: ghcr.io/agogos-llc/agogos-platform-api:unpromoted
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agogos-platform-config
            - secretRef:
                name: agogos-platform-runtime
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: agogos-api
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: agogos-platform
spec:
  selector:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: agogos-platform
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: http
