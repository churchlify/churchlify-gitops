apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agogos-database-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agogos-database-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        PGHOST: "{{ .PGSQL_HOST }}"
        PGPORT: "5432"
        PGUSER: "{{ .PGSQL_USER }}"
        PGPASSWORD: "{{ .PGSQL_PASSWORD }}"
        PGSSLMODE: disable
  data:
    - secretKey: PGSQL_USER
      remoteRef: { key: global-db-secrets, property: PGSQL_USER }
    - secretKey: PGSQL_PASSWORD
      remoteRef: { key: global-db-secrets, property: PGSQL_PASSWORD }
    - secretKey: PGSQL_HOST
      remoteRef: { key: global-db-secrets, property: PGSQL_HOST }
