apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agogos-platform-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agogos-platform-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        annotations:
          argocd.argoproj.io/sync-wave: "-2"
      data:
        DATABASE_URL: "postgresql://{{ .PGSQL_USER | urlquery }}:{{ .PGSQL_PASSWORD | urlquery }}@{{ .PGSQL_HOST }}:5432/agogos?sslmode=require"
        REDIS_URL: "redis://:{{ .REDIS_PASSWORD | urlquery }}@{{ .REDIS_HOST }}:{{ .REDIS_PORT }}/0"
        MONGO_URL: "mongodb://{{ .MONGO_USER | urlquery }}:{{ .MONGO_PASSWORD | urlquery }}@{{ .MONGO_HOST }}:{{ .MONGO_PORT }}"
        MINIO_ACCESS_KEY: "{{ .MINIO_ACCESS_KEY }}"
        MINIO_SECRET_KEY: "{{ .MINIO_SECRET_KEY }}"
        TURN_SHARED_SECRET: "{{ .TURN_SHARED_SECRET }}"
        CONNECTOR_CREDENTIAL_ENCRYPTION_KEY: "{{ .CONNECTOR_CREDENTIAL_ENCRYPTION_KEY }}"
        EMAIL_FROM: "{{ .EMAIL_FROM }}"
        EMAIL_REPLY_TO: "{{ .EMAIL_REPLY_TO }}"
        RESEND_API_KEY: "{{ .RESEND_API_KEY }}"
        BREVO_API_KEY: "{{ .BREVO_API_KEY }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        AWS_SESSION_TOKEN: "{{ .AWS_SESSION_TOKEN }}"
        STRIPE_SECRET_KEY: "{{ .STRIPE_SECRET_KEY }}"
        STRIPE_WEBHOOK_SECRET: "{{ .STRIPE_WEBHOOK_SECRET }}"
        PAYSTACK_SECRET_KEY: "{{ .PAYSTACK_SECRET_KEY }}"
        PAYSTACK_WEBHOOK_SECRET: "{{ .PAYSTACK_WEBHOOK_SECRET }}"
        FLUTTERWAVE_SECRET_KEY: "{{ .FLUTTERWAVE_SECRET_KEY }}"
        FLUTTERWAVE_WEBHOOK_SECRET: "{{ .FLUTTERWAVE_WEBHOOK_SECRET }}"
        FLUTTERWAVE_SECRET_HASH: "{{ .FLUTTERWAVE_SECRET_HASH }}"
        BILLING_WEBHOOK_SECRET: "{{ .BILLING_WEBHOOK_SECRET }}"
        IAM_STEP_UP_SECRET: "{{ .IAM_STEP_UP_SECRET }}"
  data:
    - secretKey: MONGO_USER
      remoteRef: { key: global-db-secrets, property: MONGO_USER }
    - secretKey: MONGO_PASSWORD
      remoteRef: { key: global-db-secrets, property: MONGO_PASSWORD }
    - secretKey: MONGO_HOST
      remoteRef: { key: global-db-secrets, property: MONGO_HOST }
    - secretKey: MONGO_PORT
      remoteRef: { key: global-db-secrets, property: MONGO_PORT }
    - secretKey: PGSQL_USER
      remoteRef: { key: global-db-secrets, property: PGSQL_USER }
    - secretKey: PGSQL_PASSWORD
      remoteRef: { key: global-db-secrets, property: PGSQL_PASSWORD }
    - secretKey: PGSQL_HOST
      remoteRef: { key: global-db-secrets, property: PGSQL_HOST }
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: global-db-secrets, property: MINIO_ACCESS_KEY }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: global-db-secrets, property: MINIO_SECRET_KEY }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: global-db-secrets, property: REDIS_PASSWORD }
    - secretKey: REDIS_HOST
      remoteRef: { key: global-db-secrets, property: REDIS_HOST }
    - secretKey: REDIS_PORT
      remoteRef: { key: global-db-secrets, property: REDIS_PORT }
    - secretKey: TURN_SHARED_SECRET
      remoteRef: { key: global-db-secrets, property: TURN_SECRET }
    - secretKey: CONNECTOR_CREDENTIAL_ENCRYPTION_KEY
      remoteRef:
        {
          key: global-db-secrets,
          property: CONNECTOR_CREDENTIAL_ENCRYPTION_KEY,
        }
    - secretKey: EMAIL_FROM
      remoteRef: { key: global-db-secrets, property: EMAIL_FROM }
    - secretKey: EMAIL_REPLY_TO
      remoteRef: { key: global-db-secrets, property: EMAIL_REPLY_TO }
    - secretKey: RESEND_API_KEY
      remoteRef: { key: global-db-secrets, property: RESEND_API_KEY }
    - secretKey: BREVO_API_KEY
      remoteRef: { key: global-db-secrets, property: BREVO_API_KEY }
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: global-db-secrets, property: AWS_ACCESS_KEY_ID }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: global-db-secrets, property: AWS_SECRET_ACCESS_KEY }
    - secretKey: AWS_SESSION_TOKEN
      remoteRef: { key: global-db-secrets, property: AWS_SESSION_TOKEN }
    - secretKey: STRIPE_SECRET_KEY
      remoteRef: { key: global-db-secrets, property: STRIPE_SECRET_KEY }
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef: { key: global-db-secrets, property: STRIPE_WEBHOOK_SECRET }
    - secretKey: PAYSTACK_SECRET_KEY
      remoteRef: { key: global-db-secrets, property: PAYSTACK_SECRET_KEY }
    - secretKey: PAYSTACK_WEBHOOK_SECRET
      remoteRef: { key: global-db-secrets, property: PAYSTACK_WEBHOOK_SECRET }
    - secretKey: FLUTTERWAVE_SECRET_KEY
      remoteRef: { key: global-db-secrets, property: FLUTTERWAVE_SECRET_KEY }
    - secretKey: FLUTTERWAVE_WEBHOOK_SECRET
      remoteRef:
        { key: global-db-secrets, property: FLUTTERWAVE_WEBHOOK_SECRET }
    - secretKey: FLUTTERWAVE_SECRET_HASH
      remoteRef: { key: global-db-secrets, property: FLUTTERWAVE_SECRET_HASH }
    - secretKey: BILLING_WEBHOOK_SECRET
      remoteRef: { key: global-db-secrets, property: BILLING_WEBHOOK_SECRET }
    - secretKey: IAM_STEP_UP_SECRET
      remoteRef: { key: global-db-secrets, property: IAM_STEP_UP_SECRET }
