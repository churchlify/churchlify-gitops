apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agogos-web-ingress
  namespace: agogos
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m" # Important for Admin Upload Tool
spec:
  tls:
    - hosts:
        - agogos.org
      secretName: agogos-web-tls
  rules:
    - host: agogos.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agogos-web # Points to the same service
                port:
                  number: 3000
