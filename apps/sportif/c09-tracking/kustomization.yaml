apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: c09-tracking
  namespace: sports-tracking

resources:
  - ../namespace.yaml
  - ../service.yaml
  - ../service-ai.yaml
  - deployment-tracking.yaml
  # - rbac-tracking.yaml

commonLabels:
  app.kubernetes.io/version: c09
  chunk: c09-tracking
  component.sportif: tracking

commonAnnotations:
  chunk.sportif/name: "C09 — AI tracking, jersey OCR, and face matching"
  chunk.sportif/depends-on: "C03, C08"
  chunk.sportif/status: "not-started"

namespace: sports-tracking

images:
  - name: ghcr.io/agogos-llc/sportif-tracking-worker
    newTag: latest

replicas:
  - name: tracking-worker
    count: 1
