apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sportif-all-chunks
  namespace: sports-tracking

# Include all chunks (uncomment as they become ready)
resources:
  - c06-ingest          # C06 — Ingest, segmented recording, and stream health (READY)
  # - c07-preview         # C07 — Preview and live two-camera stitching (NOT STARTED)
  # - c09-tracking        # C09 — AI tracking, jersey OCR, and face matching (NOT STARTED)
  # - c10-processing      # C10 — Reels, captions, Immich upload, and cleanup (NOT STARTED)

# Common labels for all resources
commonLabels:
  app.kubernetes.io/name: sportif
  app.kubernetes.io/part-of: sportif-platform
  app.kubernetes.io/managed-by: argocd

# Common annotations
commonAnnotations:
  argocd.argoproj.io/compare-result: 'true'
  platform.sportif/deployment-strategy: kustomize-chunks

# Namespace for all resources
namespace: sports-tracking

# Use this for ArgoCD deployment:
# apiVersion: argoproj.io/v1alpha1
# kind: Application
# metadata:
#   name: sportif
#   namespace: argocd
# spec:
#   project: default
#   source:
#     repoURL: https://github.com/your-org/sportif.git
#     targetRevision: main
#     path: manifest
#   destination:
#     server: https://kubernetes.default.svc
#     namespace: sports-tracking
#   syncPolicy:
#     automated:
#       prune: true
#       selfHeal: true
