apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sportif
  namespace: sports-tracking

# Include all chunks (uncomment as they become ready)
resources:
  # The sports-tracking Namespace is platform-owned and shared with sport-track.
  - external-secret.yaml
  - service.yaml
  - ingress.yaml
  - pvc-rwx.yaml
  - configmap-srs.yaml
  - configmap-mediamtx.yaml
  - deployment-media-ingest.yaml
  - deployment-preview-streamer.yaml
  - deployment-recorder.yaml
  - deployment-tracking.yaml
  - deployment-stitch.yaml
  - deployment-reel.yaml
  - api/overlays/production

# Common labels for all resources
commonLabels:
  app.kubernetes.io/name: sportif
  app.kubernetes.io/part-of: sportif-platform
  app.kubernetes.io/managed-by: argocd

# Common annotations
commonAnnotations:
  argocd.argoproj.io/compare-result: "true"
  platform.sportif/deployment-strategy: kustomize-chunks

# Namespace for all namespaced resources
namespace: sports-tracking

# Use this for ArgoCD deployment:
