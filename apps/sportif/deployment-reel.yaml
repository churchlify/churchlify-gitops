apiVersion: apps/v1
kind: Deployment
metadata:
  name: reel-worker
  namespace: sports-tracking
  labels:
    app: reel-worker
    component: processing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reel-worker
  template:
    metadata:
      labels:
        app: reel-worker
        component: processing
    spec:
      serviceAccountName: reel-worker
      securityContext:
        runAsNonRoot: false
        fsGroup: 1000
      containers:
        - name: reel-engine
          image: ghcr.io/agogos-llc/sportif-reel-worker:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - python
            - -u
            - -m
            - uvicorn
            - api:app
            - --host
            - '0.0.0.0'
            - --port
            - '8000'
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: '1'
            - name: PYTHONPATH
              value: '/app'
            - name: LOG_LEVEL
              value: 'info'
            - name: IMMICH_INSTANCE_URL
              value: 'https://photos.churchlify.com/api'
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sportif-secrets
                  key: immich-api-key
          resources:
            requests:
              memory: '512Mi'
              cpu: '500m'
            limits:
              memory: '2Gi'
              cpu: '2000m'
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /var/recordings
              name: media-storage
              subPath: recordings
            - mountPath: /var/reels
              name: media-storage
              subPath: reels
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: sports-media-pvc-rwx
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - reel-worker
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reel-worker
  namespace: sports-tracking
