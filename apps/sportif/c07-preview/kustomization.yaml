apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: c07-preview
  namespace: sports-tracking

resources:
  - ../namespace.yaml
  - ../service.yaml
  - ../service-ai.yaml
  - deployment-preview-streamer.yaml
  # - rbac-preview.yaml

commonLabels:
  app.kubernetes.io/version: c07
  chunk: c07-preview
  component.sportif: preview

commonAnnotations:
  chunk.sportif/name: "C07 — Preview and live two-camera stitching"
  chunk.sportif/depends-on: "C06"
  chunk.sportif/status: "not-started"

namespace: sports-tracking

images:
  - name: ghcr.io/agogos-llc/sportif-preview-streamer
    newTag: latest

replicas:
  - name: preview-streamer
    count: 1
