apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanup-worker
  namespace: sports-tracking
  labels:
    app: cleanup-worker
    component: worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cleanup-worker
  template:
    metadata:
      labels:
        app: cleanup-worker
        component: worker
    spec:
      serviceAccountName: cleanup-worker
      terminationGracePeriodSeconds: 30
      containers:
        - name: cleanup-worker
          image: ghcr.io/agogos-llc/sportif-cleanup-worker:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8007
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8007
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-worker
  namespace: sports-tracking
  labels:
    app: cleanup-worker
    component: worker

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-worker
  namespace: sports-tracking
  labels:
    app: cleanup-worker
    component: worker
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-worker
  namespace: sports-tracking
  labels:
    app: cleanup-worker
    component: worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleanup-worker
subjects:
  - kind: ServiceAccount
    name: cleanup-worker
    namespace: sports-tracking
