apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sportif-recorder-segments-pvc
  namespace: sports-tracking
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 500Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sportif-recorder-config
  namespace: sports-tracking
data:
  SEGMENT_DURATION: "300"
  MAX_RETRIES: "3"
  RECONNECT_DELAY: "5"
  LOG_LEVEL: "info"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sportif-recorder-worker
  namespace: sports-tracking
  labels:
    app: sportif-recorder-worker
    component: ingest
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sportif-recorder-worker
  template:
    metadata:
      labels:
        app: sportif-recorder-worker
        component: ingest
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sportif-recorder-worker
      terminationGracePeriodSeconds: 30
      containers:
        - name: recorder
          image: ghcr.io/agogos-llc/sportif-recorder-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: API_BASE_URL
              value: "http://api-service.sports-tracking.svc.cluster.local:3000/api"
            - name: STORAGE_PATH
              value: "/data/segments"
            - name: SEGMENT_DURATION
              valueFrom:
                configMapKeyRef:
                  name: sportif-recorder-config
                  key: SEGMENT_DURATION
            - name: MAX_RETRIES
              valueFrom:
                configMapKeyRef:
                  name: sportif-recorder-config
                  key: MAX_RETRIES
            - name: RECONNECT_DELAY
              valueFrom:
                configMapKeyRef:
                  name: sportif-recorder-config
                  key: RECONNECT_DELAY
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sportif-recorder-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: segments
              mountPath: /data/segments
      volumes:
        - name: segments
          persistentVolumeClaim:
            claimName: sportif-recorder-segments-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - sportif-recorder-worker
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sportif-recorder-worker
  namespace: sports-tracking

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sportif-recorder-worker
  namespace: sports-tracking
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sportif-recorder-worker
  namespace: sports-tracking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sportif-recorder-worker
subjects:
  - kind: ServiceAccount
    name: sportif-recorder-worker
    namespace: sports-tracking

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sportif-recorder-worker-pdb
  namespace: sports-tracking
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sportif-recorder-worker

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sportif-recorder-worker-hpa
  namespace: sports-tracking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sportif-recorder-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
