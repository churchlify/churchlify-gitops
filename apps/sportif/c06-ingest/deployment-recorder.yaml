apiVersion: v1
kind: ConfigMap
metadata:
  name: recorder-config
  namespace: sports-tracking
  labels:
    app: recorder-worker
    chunk: c06-ingest
data:
  SEGMENT_DURATION: '300'
  MAX_RETRIES: '3'
  RECONNECT_DELAY: '5'
  LOG_LEVEL: 'info'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recorder-worker
  namespace: sports-tracking
  labels:
    app: recorder-worker
    component: ingest
    chunk: c06-ingest
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: recorder-worker
  template:
    metadata:
      labels:
        app: recorder-worker
        component: ingest
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: '/metrics'
    spec:
      serviceAccountName: recorder-worker
      terminationGracePeriodSeconds: 30
      containers:
        - name: recorder
          image: ghcr.io/agogos-llc/sportif-recorder-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: API_BASE_URL
              value: 'http://api-service.sports-tracking.svc.cluster.local:3000/api'
            - name: STORAGE_PATH
              value: '/data/segments'
            - name: SEGMENT_DURATION
              valueFrom:
                configMapKeyRef:
                  name: recorder-config
                  key: SEGMENT_DURATION
            - name: MAX_RETRIES
              valueFrom:
                configMapKeyRef:
                  name: recorder-config
                  key: MAX_RETRIES
            - name: RECONNECT_DELAY
              valueFrom:
                configMapKeyRef:
                  name: recorder-config
                  key: RECONNECT_DELAY
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: recorder-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: segments
              mountPath: /data/segments
      volumes:
        - name: segments
          persistentVolumeClaim:
            claimName: recorder-segments-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - recorder-worker
                topologyKey: kubernetes.io/hostname

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: recorder-worker-pdb
  namespace: sports-tracking
  labels:
    app: recorder-worker
    chunk: c06-ingest
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: recorder-worker

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recorder-worker-hpa
  namespace: sports-tracking
  labels:
    app: recorder-worker
    chunk: c06-ingest
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recorder-worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
