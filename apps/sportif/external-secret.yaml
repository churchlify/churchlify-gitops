apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sportif-secrets
  namespace: sports-tracking
  labels:
    app.kubernetes.io/name: sportif
    app.kubernetes.io/part-of: sportif
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: sportif-secrets
    creationPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgresql://{{ .PGSQL_USER }}:{{ .PGSQL_PASSWORD }}@{{ .PGSQL_HOST }}:5432/sportif?schema=public"
        JWT_SECRET: "{{ .JWT_SECRET }}"
        IMMICH_API_KEY: "{{ .IMMICH_API_KEY }}"
  data:
    - secretKey: PGSQL_USER
      remoteRef:
        key: global-db-secrets
        property: PGSQL_USER
    - secretKey: PGSQL_PASSWORD
      remoteRef:
        key: global-db-secrets
        property: PGSQL_PASSWORD
    - secretKey: PGSQL_HOST
      remoteRef:
        key: global-db-secrets
        property: PGSQL_HOST
    - secretKey: JWT_SECRET
      remoteRef:
        key: sportif-secrets
        property: JWT_SECRET
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: sportif-secrets
        property: IMMICH_API_KEY
