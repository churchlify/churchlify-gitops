apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


namespace: sports-tracking

images:
- name: ghcr.io/agogos-llc/sportif-reel-worker
  newName: ghcr.io/agogos-llc/sportif-reel-worker
  newTag: sha-1406014
- name: ghcr.io/agogos-llc/sportif-stitch-worker
  newName: ghcr.io/agogos-llc/sportif-stitch-worker
  newTag: sha-1406014
- name: ghcr.io/churchlify/sportif-reel-worker
  newTag: latest
- name: ghcr.io/churchlify/sportif-stitch-worker
  newTag: latest

replicas:
- count: 1
  name: stitch-worker
- count: 1
  name: reel-worker

commonLabels:
  environment: production
resources:
- ../../base
