apiVersion: apps/v1
kind: Deployment
metadata:
  name: stitch-worker
  namespace: sports-tracking
  labels:
    app: stitch-worker
    component: processing
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: stitch-worker
  template:
    metadata:
      labels:
        app: stitch-worker
        component: processing
    spec:
      serviceAccountName: stitch-worker
      securityContext:
        runAsNonRoot: false
        fsGroup: 1000
      containers:
        - name: stitch-engine
          image: ghcr.io/churchlify/sportif-stitch-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
              protocol: TCP
          env:
            - name: LEFT_CAMERA_URL
              value: rtsp://preview-streamer-service.sports-tracking.svc.cluster.local:8554/left
            - name: RIGHT_CAMERA_URL
              value: rtsp://preview-streamer-service.sports-tracking.svc.cluster.local:8554/right
            - name: PREVIEW_RTSP_URL
              value: rtsp://preview-streamer-service.sports-tracking.svc.cluster.local:8554/stitched_preview
            - name: AI_TRACKER_URL
              value: http://tracking-worker-service.sports-tracking.svc.cluster.local:8000/crop-x
            - name: LOG_LEVEL
              value: 'info'
          resources:
            requests:
              memory: '512Mi'
              cpu: '500m'
            limits:
              memory: '2Gi'
              cpu: '2000m'
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - mountPath: /var/recordings
              name: media-storage
              subPath: recordings
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: sports-media-pvc-rwx
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - stitch-worker
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stitch-worker
  namespace: sports-tracking
