apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sportif-base
  namespace: sports-tracking

# Namespace and shared infrastructure
resources:
  - ../namespace.yaml
  - ../service.yaml
  - ../service-ai.yaml
  - ../ingress.yaml
  - ../pvc-rwx.yaml

# Common labels for all resources
commonLabels:
  app.kubernetes.io/part-of: sportif
  app.kubernetes.io/managed-by: argocd

# Common annotations
commonAnnotations:
  argocd.argoproj.io/compare-result: 'true'
