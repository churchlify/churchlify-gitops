apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-streamer
  namespace: sports-tracking
  labels:
    app: preview-streamer
    component: ingest
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: preview-streamer
  template:
    metadata:
      labels:
        app: preview-streamer
        component: ingest
    spec:
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: rtsp
              containerPort: 8554
              protocol: TCP
            - name: rtsps
              containerPort: 8555
              protocol: TCP
            - name: rtmp
              containerPort: 1936
              protocol: TCP
            - name: rtmps
              containerPort: 1937
              protocol: TCP
            - name: webrtc
              containerPort: 8889
              protocol: TCP
            - name: http
              containerPort: 9998
              protocol: TCP
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: mediamtx-config-volume
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
      volumes:
        - name: mediamtx-config-volume
          configMap:
            name: mediamtx-config
