apiVersion: v1
kind: ConfigMap
metadata:
  name: srs-config
  namespace: sports-tracking
data:
  srs.conf: |
    listen              1935;
    max_connections     1000;
    srs_log_tank        console;
    srs_log_level       info;

    http_api {
        enabled         on;
        listen          8080;
    }

    vhost __defaultVhost__ {
        mix_correct     on;
        time_jitter     full;

        publish {
            mr          off;
            parse_sps   on;
            # Enable query string parsing for RTMP stream keys
            parse_query on;
        }

        app live {
            live        on;
            gop_cache   off;
        }
    }
