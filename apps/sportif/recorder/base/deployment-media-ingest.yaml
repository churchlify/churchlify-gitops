apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-ingest
  namespace: sports-tracking
  labels:
    app: media-ingest
    component: ingest
    chunk: c06-ingest
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: media-ingest
  template:
    metadata:
      labels:
        app: media-ingest
        component: ingest
    spec:
      containers:
        - name: srs-server
          image: ossrs/srs:5
          imagePullPolicy: IfNotPresent
          ports:
            - name: rtmp
              containerPort: 1935
              protocol: TCP
            - name: http-api
              containerPort: 1985
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /api/v1/version
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/v1/version
              port: http-api
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: srs-config-volume
              mountPath: /usr/local/srs/conf/srs.conf
              subPath: srs.conf
      volumes:
        - name: srs-config-volume
          configMap:
            name: srs-config
