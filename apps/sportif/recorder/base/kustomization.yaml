apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sports-tracking

resources:
  - deployment-recorder.yaml
  - pvc-recorder.yaml
  - rbac-recorder.yaml

# SRS and MediaMTX are managed by Sportif's shared media component.
# Sport-track consumes the services published by that component.

labels:
  - pairs:
      app: recorder-worker
      component: media-ingest
      part-of: sportif
