apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sports-tracking

resources:
  - deployment-recorder.yaml
  - deployment-media-ingest.yaml
  - pvc-recorder.yaml
  - rbac-recorder.yaml

# Note: SRS and MediaMTX are managed by sport-track application
# Sportif's recorder consumes from sport-track's media stack

commonLabels:
  app: recorder-worker
  component: media-ingest
  part-of: sportif
