apiVersion: v1
kind: ServiceAccount
metadata:
  name: recorder-worker
  namespace: sports-tracking
  labels:
    app: recorder-worker

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: recorder-worker
  namespace: sports-tracking
  labels:
    app: recorder-worker
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['pods/log']
    verbs: ['get']

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recorder-worker
  namespace: sports-tracking
  labels:
    app: recorder-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: recorder-worker
subjects:
  - kind: ServiceAccount
    name: recorder-worker
    namespace: sports-tracking
