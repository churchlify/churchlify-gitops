---
# ArgoCD Application for C06 — Ingest, segmented recording, and stream health
# Deploy this to your ArgoCD instance to manage C06 via GitOps
# kubectl apply -f manifest/argocd-application-c06.yaml

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sportif-c06-ingest
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sportif
    chunk: c06-ingest

spec:
  project: default

  source:
    repoURL: https://github.com/your-org/sportif.git  # Update to your repo
    targetRevision: main
    path: manifest/c06-ingest

  destination:
    server: https://kubernetes.default.svc
    namespace: sports-tracking

  # Sync policy: automated with pruning and self-healing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Notification on sync completion
  # Requires ArgoCD notifications controller setup
  # notifications:
  #   - name: on-sync-succeeded
  #     template: app-deployed
  #     when: SyncOperationStatus=Succeeded

---
# Alternative: Manifest for full stack (C06 + future chunks)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sportif-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sportif
    app: sportif-platform

spec:
  project: default

  source:
    repoURL: https://github.com/your-org/sportif.git  # Update to your repo
    targetRevision: main
    path: manifest  # Root kustomization that includes enabled chunks

  destination:
    server: https://kubernetes.default.svc
    namespace: sports-tracking

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
