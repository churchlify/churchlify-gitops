apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx-config
  namespace: sports-tracking
data:
  mediamtx.yml: |
    logLevel: info
    logDestinations: [stdout]

    # Browser-consumable preview protocols. Streams are published internally
    # over RTSP with match-scoped paths such as <match_id>_left,
    # <match_id>_right, and <match_id>_stitched_preview.
    webrtc: yes
    webrtcAddress: :8889
    webrtcAllowOrigins: ["*"]
    # Disable direct pod ICE candidates; internet clients use the shared TURN
    # relay instead of an address inside the Kubernetes overlay network.
    webrtcLocalUDPAddress: ""
    webrtcIPsFromInterfaces: false
    # TURN is provided by platform/coturn. The secret-backed password is
    # injected with MTX_WEBRTCICESERVERS2_0_PASSWORD in the deployment.
    webrtcICEServers2:
      - url: turn:turn.churchlify.com:3478?transport=tcp
        username: AUTH_SECRET

    hls: yes
    hlsAddress: :8888
    hlsAllowOrigins: ["*"]

    paths:
      all_others:
        runOnAvailable: >
          sh -c '
            if echo "$MTX_PATH" | grep -q "_left"; then
              (
                MATCH_ID=$(echo "$MTX_PATH" | sed "s/_left$//")
                JERSEYS=$(echo "$MTX_QUERY" | sed -n "s/.*jerseys=\([^&]*\).*/\1/p")
                if [ -z "$JERSEYS" ]; then JERSEYS="7,10,99"; fi
                sleep 2
                curl -X POST http://reel-generator-service.sports-tracking.svc.cluster.local:8000/generate \
                  -H "Content-Type: application/json" \
                  -d "{\"match_id\": \"$MATCH_ID\", \"jerseys\": \"$JERSEYS\", \"left_url\": \"rtsp://preview-streamer-service.sports-tracking.svc.cluster.local:8554/${MATCH_ID}_left\", \"right_url\": \"rtsp://preview-streamer-service.sports-tracking.svc.cluster.local:8554/${MATCH_ID}_right\", \"upload_immich\": true}"
              ) &
            fi
          '
