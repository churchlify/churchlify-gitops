apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-streamer
  namespace: sports-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preview-streamer
  template:
    metadata:
      labels:
        app: preview-streamer
        component: media
    spec:
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: rtsp
              containerPort: 8554
            - name: webrtc
              containerPort: 8889
            - name: rtmp
              containerPort: 1936
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: mediamtx-config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
      volumes:
        - name: mediamtx-config
          configMap:
            name: mediamtx-config
