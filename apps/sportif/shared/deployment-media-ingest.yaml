apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-ingest
  namespace: sports-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-ingest
  template:
    metadata:
      labels:
        app: media-ingest
        component: media
    spec:
      containers:
        - name: srs-server
          image: ossrs/srs:5
          imagePullPolicy: IfNotPresent
          ports:
            - name: rtmp
              containerPort: 1935
            - name: http-api
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/v1/versions
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/versions
              port: http-api
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: srs-config
              mountPath: /usr/local/srs/conf/srs.conf
              subPath: srs.conf
      volumes:
        - name: srs-config
          configMap:
            name: srs-config
