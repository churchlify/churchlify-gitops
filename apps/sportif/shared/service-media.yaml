apiVersion: v1
kind: Service
metadata:
  name: media-ingest-service
  namespace: sports-tracking
spec:
  type: LoadBalancer
  selector:
    app: media-ingest
  ports:
    - name: rtmp
      port: 1935
      targetPort: 1935
    - name: http-api
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: preview-streamer-service
  namespace: sports-tracking
spec:
  selector:
    app: preview-streamer
  ports:
    - name: rtsp
      port: 8554
      targetPort: 8554
    - name: webrtc
      port: 8889
      targetPort: 8889
    - name: rtmp
      port: 1936
      targetPort: 1936
