apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sportif-shared
  namespace: sports-tracking

# Note: Namespace is shared with sport-track and already created separately
# Do not include namespace.yaml in resources to avoid conflicts
resources:
  - external-secret.yaml
  - configmap-srs.yaml
  - configmap-mediamtx.yaml
  - deployment-media-ingest.yaml
  - deployment-preview-streamer.yaml
  - service-media.yaml
  - ingress-preview-streamer.yaml
  - pvc-rwx.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: sportif
      app.kubernetes.io/managed-by: argocd
