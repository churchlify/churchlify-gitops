apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: churchlify-api-sync
  namespace: churchlify
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: churchlify-secrets
    creationPolicy: Merge
    template:
      mergePolicy: Merge
      data:
        MONGO_URI: "mongodb://{{ .MONGO_USER }}:{{ .MONGO_PASSWORD }}@{{ .MONGO_HOST }}:{{ .MONGO_PORT }}/churchlify?authSource=admin"
        TURN_REALM: "turn.churchlify.com"
        TURN_URL: "turn.churchlify.com"
        TURN_USER_EXPIRY_SEC: "600"
        TURN_MIN_PORT: "49160"
        TURN_MAX_PORT: "49200"
        MEDIASOUP_MIN_PORT: "42000"
        MEDIASOUP_MAX_PORT: "42100"
        EMAIL_HOST: "smtp-relay.brevo.com"
        EMAIL_PORT: "587"
        EMAIL_FROM: "Churchlify <hello@churchlify.com>"
        EMAIL_SENDER_NAME: "Churchlify"
        EMAIL_SENDER_EMAIL: "hello@churchlify.com"
        EMAIL_API_URL: "https://api.sendpulse.com"
  data:
    - secretKey: MONGO_USER
      remoteRef:
        key: global-db-secrets
        property: MONGO_USER
    - secretKey: MONGO_PASSWORD
      remoteRef:
        key: global-db-secrets
        property: MONGO_PASSWORD
    - secretKey: MONGO_HOST
      remoteRef:
        key: global-db-secrets
        property: MONGO_HOST
    - secretKey: MONGO_PORT
      remoteRef:
        key: global-db-secrets
        property: MONGO_PORT
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: global-db-secrets
        property: MINIO_ACCESS_KEY
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: global-db-secrets
        property: MINIO_SECRET_KEY
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: global-db-secrets
        property: REDIS_PASSWORD
    - secretKey: REDIS_HOST
      remoteRef:
        key: global-db-secrets
        property: REDIS_HOST
    - secretKey: REDIS_PORT
      remoteRef:
        key: global-db-secrets
        property: REDIS_PORT
    - secretKey: TURN_SHARED_SECRET
      remoteRef:
        key: global-db-secrets
        property: TURN_SECRET
