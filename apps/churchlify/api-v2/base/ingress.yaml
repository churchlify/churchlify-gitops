apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: churchlify-api-v2-ingress
  namespace: churchlify
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - v2.api.churchlify.com
      secretName: churchlify-api-v2-tls
  rules:
    - host: v2.api.churchlify.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: churchlify-api-v2 # Must match your Service name
                port:
                  number: 3000 # Match the Service port
