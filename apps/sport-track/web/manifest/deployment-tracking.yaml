apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-worker
  namespace: sports-tracking
  labels:
    app: tracking-worker
    component: processing
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tracking-worker
  template:
    metadata:
      labels:
        app: tracking-worker
        component: processing
    spec:
      serviceAccountName: tracking-worker
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - media-ingest
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: tracker
          image: ghcr.io/agogos-llc/sportif-tracking-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            - name: STREAM_INPUT_URL
              value: "rtmp://media-ingest-service.sports-tracking.svc.cluster.local:1935/live/left"
            - name: PREVIEW_RTSP_OUT
              value: "rtsp://preview-streamer-service.sports-tracking.svc.cluster.local:8554/tracked_preview"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: media-storage
              mountPath: /var/reels
              subPath: reels
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: media-storage
          persistentVolumeClaim:
            claimName: sports-media-pvc-rwx

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracking-worker
  namespace: sports-tracking
