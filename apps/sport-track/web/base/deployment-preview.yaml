apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-streamer
  namespace: sports-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preview-streamer
  template:
    metadata:
      labels:
        app: preview-streamer
    spec:
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:latest
          ports:
            - name: rtsp
              containerPort: 8554
            - name: webrtc
              containerPort: 8889
            - name: rtmp
              containerPort: 1936
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            # Mount the custom config file into MediaMTX root dir
            - name: mediamtx-config-volume
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
      volumes:
        - name: mediamtx-config-volume
          configMap:
            name: mediamtx-config
