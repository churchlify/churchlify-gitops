apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-reel-sync
  namespace: sports-tracking
spec:
  # Slow schedule down to every 2 hours (or run on-demand after match jobs)
  schedule: "0 */1 * * *"
  concurrencyPolicy: Forbid # <--- CRITICAL: Prevents a new job from starting if the previous one is still uploading!
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values:
                          - media-ingest
                  topologyKey: "kubernetes.io/hostname"
          containers:
            - name: immich-cli
              image: ghcr.io/immich-app/immich-cli:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  # REMOVED --skip-hash so Immich deduplicates existing reels!
                  immich upload \
                    --album-name "Soccer Match Reels" \
                    --recursive \
                    /var/reels
              env:
                - name: IMMICH_INSTANCE_URL
                  value: "https://photos.churchlify.com/api"
                - name: IMMICH_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sport-secrets
                      key: immich-api-key
              volumeMounts:
                - name: media-storage
                  mountPath: /var/reels
                  subPath: reels
          volumes:
            - name: media-storage
              persistentVolumeClaim:
                claimName: sports-media-pvc
