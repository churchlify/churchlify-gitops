apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sport-track-ingress
  namespace: sports-tracking
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Enable WebSocket upgrades for low-latency WebRTC signals
    nginx.ingress.kubernetes.io/websocket-services: "preview-streamer-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts:
        - sports-ai.churchlify.com
      secretName: sport-track-tls
  rules:
    - host: sports-ai.churchlify.com
      http:
        paths:
          # AI Tracking Crop Endpoint
          - path: /crop-x
            pathType: Prefix
            backend:
              service:
                name: sport-track-service
                port:
                  number: 8000
          # Real-time WebRTC Live Preview Stream
          - path: /preview
            pathType: Prefix
            backend:
              service:
                name: preview-streamer-service
                port:
                  number: 8889
          # Dedicated Reel Creation API
          - path: /reels
            pathType: Prefix
            backend:
              service:
                name: reel-generator-service
                port:
                  number: 8000
