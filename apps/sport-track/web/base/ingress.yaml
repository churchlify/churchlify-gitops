apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sport-track-ingress
  namespace: sports-tracking
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod" # Automatically provisions free SSL certificates
spec:
  tls:
    - hosts:
        - sports-ai.churchlify.com
      secretName: sport-track-tls
  rules:
    - host: sports-ai.churchlify.com
      http:
        paths:
          - path: /crop-x
            pathType: Prefix
            backend:
              service:
                name: sport-track-service
                port:
                  number: 8000
