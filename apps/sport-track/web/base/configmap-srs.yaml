apiVersion: v1
kind: ConfigMap
metadata:
  name: srs-config
  namespace: sports-tracking
data:
  srs.conf: |
    listen              1935;
    max_connections     1000;
    srs_log_tank        console;
    srs_log_level       info;

    http_api {
        enabled         on;
        listen          8080;
    }

    vhost __defaultVhost__ {
        # Fix iPhone timestamp jitter & audio sync
        mix_correct     on;
        time_jitter     full;

        # Mobile-friendly buffer settings
        publish {
            mr          off;
            parse_sps   on;
        }

        # Enable default live application routing
        app live {
            live        on;
            gop_cache   off;
            queue_length 10;
        }
    }
