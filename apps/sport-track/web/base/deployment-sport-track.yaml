apiVersion: apps/v1
kind: Deployment
metadata:
  name: sport-track
  namespace: sports-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sport-track
  template:
    metadata:
      labels:
        app: sport-track
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - media-ingest
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: tracker
          image: ghcr.io/agogos-llc/sport-track-stitch-v2:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: STREAM_INPUT_URL
              value: "rtmp://media-ingest-service.sports-tracking.svc.cluster.local:1935/live/left"
            - name: PREVIEW_RTSP_OUT
              value: "rtsp://preview-streamer-service.sports-tracking.svc.cluster.local:8554/tracked_preview"
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            # Shared memory access for reading/writing numpy frame buffers
            - name: dshm
              mountPath: /dev/shm
            # Persistent clip/reel generation output
            - name: media-storage
              mountPath: /var/reels
              subPath: reels
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: media-storage
          persistentVolumeClaim:
            claimName: sports-media-pvc-rwx
