apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-ingest
  namespace: sports-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-ingest
  template:
    metadata:
      labels:
        app: media-ingest
    spec:
      containers:
        - name: srs-server
          image: ossrs/srs:5
          ports:
            - name: rtmp
              containerPort: 1935
            - name: http-api
              containerPort: 8080
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /api/v1/versions
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/versions
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: srs-config-volume
              mountPath: /usr/local/srs/conf/srs.conf
              subPath: srs.conf
      volumes:
        - name: srs-config-volume
          configMap:
            name: srs-config
