apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-stitcher
  namespace: sports-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-stitcher
  template:
    metadata:
      labels:
        app: video-stitcher
    spec:
      containers:
        - name: ffmpeg-engine
          image: ghcr.io/agogos-llc/sport-track-stitcher:latest
          imagePullPolicy: Always
          env:
            - name: YOUTUBE_STREAM_KEY
              valueFrom:
                secretKeyRef:
                  name: sport-secrets
                  key: stream-key
            - name: AI_TRACKER_URL
              value: "http://sport-track-service.sports-tracking.svc.cluster.local:8000/crop-x"
          resources:
            requests:
              memory: "1Gi"
              cpu: "1500m"
            limits:
              memory: "2Gi"
              cpu: "3000m" # Perfect overhead matching for concurrent hstack and crop calculations
