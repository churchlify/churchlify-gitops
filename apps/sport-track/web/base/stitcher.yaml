apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-stitcher
  namespace: sports-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-stitcher
  template:
    metadata:
      labels:
        app: video-stitcher
    spec:
      containers:
        # The Unified Video Engine & Controller Link
        - name: ffmpeg-engine
          image: ghcr.io/agogos-llc/sport-track-stitcher:latest
          command: ["python"]
          args: ["-u", "/app/live-bridge.py"]
          imagePullPolicy: Always
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: AI_TRACKER_URL
              value: "http://sport-track-service.sports-tracking.svc.cluster.local:8000/crop-x"
            - name: YOUTUBE_STREAM_KEY
              valueFrom:
                secretKeyRef:
                  name: sport-secrets
                  key: stream-key
            - name: VIDEO_BITRATE
              value: "4500k"
            - name: VIDEO_MAXRATE
              value: "4500k"
            - name: VIDEO_BUFSIZE
              value: "9000k"
            - name: SMOOTHING
              value: "0.90"
          resources:
            requests:
              memory: "3Gi"
              cpu: "4000m"
            limits:
              memory: "6Gi"
              cpu: "6000m"
