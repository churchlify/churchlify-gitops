apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-stitcher
  namespace: sports-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-stitcher
  template:
    metadata:
      labels:
        app: video-stitcher
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - media-ingest
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: ffmpeg-engine
          # --- UPDATED V2 IMAGE PIPELINE ---
          image: ghcr.io/agogos-llc/sport-track-stitch-v2:latest
          imagePullPolicy: Always
          # (command and args removed to use image ENTRYPOINT/CMD)
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: AI_TRACKER_URL
              value: "http://sport-track-service.sports-tracking.svc.cluster.local:8000/crop-x"
            - name: PREVIEW_RTSP_URL
              value: "rtsp://preview-streamer-service.sports-tracking.svc.cluster.local:8554/stitched_preview"
            - name: YOUTUBE_STREAM_KEY
              valueFrom:
                secretKeyRef:
                  name: sport-secrets
                  key: stream-key
            - name: VIDEO_BITRATE
              value: "3000k"
            - name: VIDEO_MAXRATE
              value: "3000k"
            - name: VIDEO_BUFSIZE
              value: "3000k"
            - name: SMOOTHING
              value: "0.90"
          resources:
            requests:
              memory: "2Gi"
              cpu: "2000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          volumeMounts:
            # 1. RAM Shared Memory for zero-latency frame buffers
            - name: dshm
              mountPath: /dev/shm
            # 2. Longhorn persistent mounts
            - name: media-storage
              mountPath: /var/recordings
              subPath: recordings
            - name: media-storage
              mountPath: /var/reels
              subPath: reels
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: media-storage
          persistentVolumeClaim:
            claimName: sports-media-pvc
