apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-stitcher
  namespace: sports-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-stitcher
  template:
    metadata:
      labels:
        app: video-stitcher
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - media-ingest
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: ffmpeg-engine
          image: ghcr.io/agogos-llc/sport-track-stitcher:latest
          command: ["python"]
          args: ["-u", "/app/live-bridge.py"]
          imagePullPolicy: Always
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: AI_TRACKER_URL
              value: "http://sport-track-service.sports-tracking.svc.cluster.local:8000/crop-x"
            - name: YOUTUBE_STREAM_KEY
              valueFrom:
                secretKeyRef:
                  name: sport-secrets
                  key: stream-key
            # --- CONSTRAINED LOWER OVERHEAD LIVE BITRATES ---
            - name: VIDEO_BITRATE
              value: "3000k"
            - name: VIDEO_MAXRATE
              value: "3000k"
            - name: VIDEO_BUFSIZE
              value: "3000k"
            - name: SMOOTHING
              value: "0.90"
          resources:
            requests:
              memory: "2Gi"
              cpu: "2000m" # <--- Scaled down to allow the host VM node to breathe
            limits:
              memory: "4Gi"
              cpu: "4000m"
