apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-stitcher
  namespace: sports-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-stitcher
  template:
    metadata:
      labels:
        app: video-stitcher
    spec:
      containers:
        # Container A: The Core Video Engine
        - name: ffmpeg-engine
          image: ghcr.io/agogos-llc/sport-track-stitcher:latest
          command: ["python", "/app/stream_engine.py"]
          imagePullPolicy: Always
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: YOUTUBE_STREAM_KEY
              valueFrom:
                secretKeyRef:
                  name: sport-secrets
                  key: stream-key
          resources:
            requests:
              memory: "2Gi"
              cpu: "2000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"

        # Container B: The AI Tracking Coordinate Link (The Sidecar)
        - name: tracker-orchestrator
          image: ghcr.io/agogos-llc/sport-track-stitcher:sha-c35e907
          command: ["python", "/app/tracker_orchestrator.py"]
          imagePullPolicy: Always
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: AI_TRACKER_URL
              value: "http://sport-track-service.sports-tracking.svc.cluster.local:8000/crop-x"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
