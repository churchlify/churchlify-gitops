apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-stitcher
  namespace: sports-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-stitcher
  template:
    metadata:
      labels:
        app: video-stitcher
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - media-ingest
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: ffmpeg-engine
          image: ghcr.io/agogos-llc/sport-track-stitch-v2:latest
          imagePullPolicy: Always
          # --- ENTRYPOINT OVERRIDE WITH REQUIRED CLI FLAGS ---
          command: ["python", "/app/pipeline.py"]
          args:
            - "--match-id"
            - "$(MATCH_ID)"
            - "--left"
            - "$(LEFT_CAMERA_URL)"
            - "--right"
            - "$(RIGHT_CAMERA_URL)"
            - "--jerseys"
            - "$(JERSEY_COLORS)"
            - "--output-dir"
            - "/var/recordings"
            - "--gpu"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # --- REQUIRED PARAMETERS FOR PIPELINE.PY ---
            - name: MATCH_ID
              value: "game-01"
            - name: LEFT_CAMERA_URL
              value: "rtsp://media-ingest:8554/left"
            - name: RIGHT_CAMERA_URL
              value: "rtsp://media-ingest:8554/right"
            - name: JERSEY_COLORS
              value: "red,blue" # Adjust team primary colors as needed
            # --- EXISTING CONFIGURATION ---
            - name: AI_TRACKER_URL
              value: "http://sport-track-service.sports-tracking.svc.cluster.local:8000/crop-x"
            - name: PREVIEW_RTSP_URL
              value: "rtsp://preview-streamer-service.sports-tracking.svc.cluster.local:8554/stitched_preview"
            - name: YOUTUBE_STREAM_KEY
              valueFrom:
                secretKeyRef:
                  name: sport-secrets
                  key: stream-key
          resources:
            requests:
              memory: "2Gi"
              cpu: "2000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: media-storage
              mountPath: /var/recordings
              subPath: recordings
            - name: media-storage
              mountPath: /var/reels
              subPath: reels
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: media-storage
          persistentVolumeClaim:
            claimName: sports-media-pvc
