apiVersion: apps/v1
kind: Deployment
metadata:
  name: reel-generator
  namespace: sports-tracking
spec:
  replicas: 1
  # Recreate strategy ensures old pod terminates and unmounts RWO volume BEFORE new pod starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reel-generator
  template:
    metadata:
      labels:
        app: reel-generator
    spec:
      containers:
        - name: reel-api
          image: ghcr.io/agogos-llc/sport-track-stitch-v2:latest
          workingDir: /app
          command: [
              "python",
              "-u", # Unbuffered output flag for Python
              "-m",
              "uvicorn",
              "api:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8000",
            ]
          ports:
            - containerPort: 8000
          env:
            # Prevents Python stdout/stderr buffering inside Kubernetes logs
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: "/app"
            - name: IMMICH_INSTANCE_URL
              value: "https://photos.churchlify.com/api"
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sportif-secrets
                  key: IMMICH_API_KEY

          # Healthchecks to prevent NGINX 502 Bad Gateway during startup
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

          volumeMounts:
            - mountPath: /var/recordings
              name: media-storage
              subPath: recordings
            - mountPath: /var/reels
              name: media-storage
              subPath: reels
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: sports-media-pvc-rwx
---
apiVersion: v1
kind: Service
metadata:
  name: reel-generator-service
  namespace: sports-tracking
spec:
  type: ClusterIP
  selector:
    app: reel-generator
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
