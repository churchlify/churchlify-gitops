# Placeholder values for the 3 keys the live sportif-secrets Secret
# (apps/sportif/shared/external-secret.yaml) doesn't have yet -- two are
# brand new to the sportif-v2 split, and SMTP_PASSWORD was never synced
# even by the old ExternalSecret. Everything else (JWT_SECRET,
# DATABASE_URL, REDIS_URL, REDIS_PASSWORD) is read straight from
# sportif-secrets via envFrom in api-v2/queue-worker-v2/notifications-v2 --
# same DB, same Redis, same JWT trust as the live v1 app, deliberately.
#
# Replace these with real values (or fold them into the platform-secrets
# ClusterSecretStore's global-db-secrets key and switch this to an
# ExternalSecret) before relying on SMTP/internal-API-key auth in
# production.
apiVersion: v1
kind: Secret
metadata:
  name: api-v2-extra-secrets
  namespace: sports-tracking
type: Opaque
stringData:
  SMTP_PASSWORD: 'YOUR_SMTP2GO_API_KEY'
  INTERNAL_API_KEY: 'change-me-in-production'
  SENDER_PROFILE_ENCRYPTION_KEY: 'change-me-in-production'
