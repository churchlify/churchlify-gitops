# Syncs the 3 keys the live sportif-secrets Secret (apps/sportif/shared/
# external-secret.yaml) doesn't carry: SMTP_PASSWORD and INTERNAL_API_KEY
# are proven remote properties on global-db-secrets; the sender-profile
# encryption key is too, but under a different remote name
# (NOTIFICATION_PROFILES_KEY) than the env var the app reads
# (SENDER_PROFILE_ENCRYPTION_KEY, see apps/api/src/notifications/
# sender-profile-crypto.ts) -- the template below renames it.
#
# Deliberately a separate ExternalSecret/target rather than folding
# these into apps/sportif/shared/external-secret.yaml: v1 doesn't use
# any of them, and this way sportif-v2's secret surface never touches
# the live app's ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-v2-extra-secrets-sync
  namespace: sports-tracking
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: api-v2-extra-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SMTP_PASSWORD: '{{ .SMTP_PASSWORD }}'
        INTERNAL_API_KEY: '{{ .INTERNAL_API_KEY }}'
        SENDER_PROFILE_ENCRYPTION_KEY: '{{ .NOTIFICATION_PROFILES_KEY }}'
  data:
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: global-db-secrets
        property: SMTP_PASSWORD
    - secretKey: INTERNAL_API_KEY
      remoteRef:
        key: global-db-secrets
        property: INTERNAL_API_KEY
    - secretKey: NOTIFICATION_PROFILES_KEY
      remoteRef:
        key: global-db-secrets
        property: NOTIFICATION_PROFILES_KEY
