# Permanent MinIO credentials for the dedicated, non-administrative GameMaster
# backend identity. Never place Mobile sessions or one-time cleanup credentials
# in this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-v2-gamemaster-storage-secrets-sync
  namespace: sports-tracking
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: api-v2-gamemaster-storage-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GAMEMASTER_S3_ACCESS_KEY: "{{ .GAMEMASTER_S3_ACCESS_KEY }}"
        GAMEMASTER_S3_SECRET_KEY: "{{ .GAMEMASTER_S3_SECRET_KEY }}"
  data:
    - secretKey: GAMEMASTER_S3_ACCESS_KEY
      remoteRef:
        key: global-db-secrets
        property: GAMEMASTER_S3_ACCESS_KEY
    - secretKey: GAMEMASTER_S3_SECRET_KEY
      remoteRef:
        key: global-db-secrets
        property: GAMEMASTER_S3_SECRET_KEY
