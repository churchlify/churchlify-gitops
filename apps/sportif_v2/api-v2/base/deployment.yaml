apiVersion: v1
kind: ConfigMap
metadata:
  name: api-v2-config
  namespace: sports-tracking
  labels:
    app: api-v2
    component: backend
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  JWT_EXPIRY: "900"
  REFRESH_TOKEN_EXPIRY: "604800"
  SMTP_HOST: "mail.smtp2go.com"
  SMTP_PORT: "2525"
  SMTP_USER: "YOUR_SMTP2GO_USERNAME"
  EMAIL_FROM: "noreply@sportif.local"
  APP_URL: "https://sportif.churchlify.com"
  STREAM_INGEST_BASE_URL: "rtmp://sportif.churchlify.com:1935/live"
  HLS_GATEWAY_URL: ""
  RECORDING_SERVICE_URL: "http://recording-service:8000"
  VISION_PROCESSING_SERVICE_URL: "http://vision-processing-service:8001"
  STITCHING_SERVICE_URL: "http://stitching-service:8003"
  REEL_GENERATION_SERVICE_URL: "http://reel-generation-service:8004"
  UPLOAD_SERVICE_URL: "http://upload-service:8005"
  NOTIFICATION_BRIDGE_SERVICE_URL: "http://notification-bridge-service:8006"
  CLEANUP_SERVICE_URL: "http://cleanup-service:8007"
  # queue-worker-v2/notifications-v2 in this same app -- not the live v1
  # notification-service.
  NOTIFICATIONS_SERVICE_URL: "http://notifications-v2-service:3001"
  CORS_ORIGINS: "http://localhost:3000, http://localhost:8081, http://localhost:8082, https://sportif.churchlify.com"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v2
  namespace: sports-tracking
  labels:
    app: api-v2
    component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-v2
  template:
    metadata:
      labels:
        app: api-v2
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-v2
          image: ghcr.io/agogos-llc/sportif-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # sportif-secrets is the live v1 Secret (apps/sportif/shared/
          # external-secret.yaml) -- api-v2 deliberately shares
          # JWT_SECRET/DATABASE_URL/REDIS_* with v1 rather than syncing
          # its own copy: same DB, same Redis, and existing v1 JWTs stay
          # valid against v2. api-v2-extra-secrets covers the 3 keys
          # sportif-secrets doesn't have yet (see shared/secret-extras.yaml).
          envFrom:
            - configMapRef:
                name: api-v2-config
            - secretRef:
                name: sportif-secrets
            - secretRef:
                name: api-v2-extra-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
