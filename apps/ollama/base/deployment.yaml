apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: qe-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          command: ["/bin/sh", "/mnt/scripts/bootstrap.sh"]
          ports:
            - containerPort: 11434
              name: api
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_NUM_PARALLEL
              value: "4" # Allows 4 parallel test suites
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2" # Keeps both Llama and CodeLlama in VRAM if possible
          # resources:
          #   limits:
          #     nvidia.com/gpu: 1 # Requests your passthrough GPU
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
            - name: scripts
              mountPath: /mnt/scripts
      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc
        - name: scripts
          configMap:
            name: ollama-bootstrap
            defaultMode: 0755
