apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-allow-qe-only
  namespace: qe-infra
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: qe-runner # Only pods with this label can access Ollama
      ports:
        - protocol: TCP
          port: 11434
