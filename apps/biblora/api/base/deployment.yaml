apiVersion: apps/v1
kind: Deployment
metadata:
  name: biblora-api
  namespace: biblora
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: biblora-api
  template:
    metadata:
      labels:
        app: biblora-api
    spec:
      initContainers:
      - name: db-init
        image: postgres:15
        command: ["/bin/sh", "-c"]
        args:
          - |
            export PGPASSWORD=$PGSQL_PASSWORD
            psql -h $PGSQL_HOST -p $PGSQL_PORT -U $PGSQL_USER -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'biblora'" | grep -q 1 || \
            psql -h $PGSQL_HOST -p $PGSQL_PORT -U $PGSQL_USER -d postgres -c "CREATE DATABASE biblora"
        envFrom:
        - secretRef:
            name: biblora-secrets

      - name: prisma-migrate
        image: ghcr.io/churchlify/biblora-api:latest
        command: ["sh", "-c"]
        args:
          - |
            set -ex
            # 1. Standard safety check
            until nc -z $PGSQL_HOST $PGSQL_PORT; do echo "Waiting for DB..."; sleep 2; done

            # 2. Apply the schema changes (Add Quiz, drop interaction)
            echo "Applying Migrations..."
            npx prisma migrate deploy

            # 3. Regenerate the client inside the container environment
            # This ensures the internal Node engine is synced with the DB
            npx prisma generate

            # 4. Seed new content
            echo "Running seed..."
            node dist/prisma/seed.js
        envFrom:
        - secretRef:
            name: biblora-secrets

      containers:
      - name: api
        image: ghcr.io/churchlify/biblora-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: biblora-secrets
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10