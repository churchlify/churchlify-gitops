apiVersion: apps/v1
kind: Deployment
metadata:
  name: biblora-api
  namespace: biblora
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: biblora-api
  template:
    metadata:
      labels:
        app: biblora-api
    spec:
      initContainers:
        - name: db-init
          image: postgres:15
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for DB..."
              until pg_isready -h pgsql-postgresql.platform.svc.cluster.local -p 5432; do
                sleep 2
              done
              echo "DB is ready!"

        - name: prisma-migrate
          image: ghcr.io/churchlify/biblora-api:latest
          command: ["sh", "-c"]
          args:
            - |
              echo "Running prisma migrations"
              npx prisma migrate deploy --schema ./prisma/schema.prisma
          envFrom:
            - secretRef:
                name: biblora-secrets

      containers:
        - name: api
          image: ghcr.io/churchlify/biblora-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: biblora-secrets
          # env:
          #   # Explicitly set the path where the file will be mounted
          #   - name: OPUS_AUTH_FILE
          #     value: "/app/auth.json"
          # resources:
          #   limits:
          #     cpu: "1000m" # Bumped for Playwright/Chromium stability
          #     memory: "1Gi" # Chromium is hungry; 512Mi might OOM on Opus
          #   requests:
          #     cpu: "500m"
          #     memory: "512Mi"
          # volumeMounts:
          #   # Mount the specific auth file
          #   - name: opus-auth-config
          #     mountPath: "/app/auth.json"
          #     subPath: "auth.json"
          #   # Mandatory for Chromium in Containers
          #   - name: dshm
          #     mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

      # volumes:
      #   # Volume 1: Projecting the Secret as a file
      #   - name: opus-auth-config
      #     secret:
      #       secretName: biblora-secrets
      #       items:
      #         - key: "auth.json"
      #           path: "auth.json"
      #   # Volume 2: Shared Memory (Prevents 'Protocol Error' in Playwright)
      #   - name: dshm
      #     emptyDir:
      #       medium: Memory
