apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: biblora-api-sync
  namespace: biblora
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: biblora-secrets
    creationPolicy: Merge
    template:
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgresql://{{ .PGSQL_USER }}:{{ .PGSQL_PASSWORD }}@{{ .PGSQL_HOST }}:5432/biblora?schema=public&connection_limit=10&pool_timeout=30"
        PGSQL_PORT: "5432"
        MINIO_ENDPOINT: "https://s3.churchlify.com"
        MINIO_BUCKET: "biblora-assets"
        MINIO_USE_SSL: "false"
        MINIO_REGION: "us-east-1"
        MINIO_PORT: "9000"
  data:
    - secretKey: PGSQL_USER
      remoteRef:
        key: global-db-secrets
        property: PGSQL_USER
    - secretKey: PGSQL_PASSWORD
      remoteRef:
        key: global-db-secrets
        property: PGSQL_PASSWORD
    - secretKey: PGSQL_HOST
      remoteRef:
        key: global-db-secrets
        property: PGSQL_HOST
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: global-db-secrets
        property: MINIO_ACCESS_KEY
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: global-db-secrets
        property: MINIO_SECRET_KEY
   