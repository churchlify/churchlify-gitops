apiVersion: batch/v1
kind: Job
metadata:
  name: biblora-db-init-v2
  namespace: biblora
spec:
  template:
    spec:
      initContainers:
      - name: db-init
        image: ghcr.io/churchlify/biblora-api:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Same script as the Job
            export PGPASSWORD=$PG_PASSWORD
            psql -h $PG_HOST -p $PG_PORT -U $PG_USER -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'biblora'" | grep -q 1 || \
            psql -h $PG_HOST -p $PG_PORT -U $PG_USER -d postgres -c "CREATE DATABASE biblora"
            npx prisma db push
        envFrom:
          - secretRef:
              name: biblora-secrets
      containers:
      - name: db-prep
        image: ghcr.io/churchlify/biblora-api:latest
        # We use a shell wrapper to create the DB if it doesn't exist
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "--- 🐘 Checking if database 'biblora' exists..."
            # Connect to the default 'postgres' db to run the check/create
            # We derive the host/port from the same env vars
            export PGPASSWORD=$PG_PASSWORD
            psql -h $PG_HOST -p $PG_PORT -U $PG_USER -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'biblora'" | grep -q 1 || \
            psql -h $PG_HOST -p $PG_PORT -U $PG_USER -d postgres -c "CREATE DATABASE biblora"
            
            echo "--- 🚀 Running Prisma DB Push..."
            npx prisma db push
            
            echo "--- 🌱 (Optional) Seeding the Lab..."
            # npx prisma db seed
        envFrom:
        - secretRef:
            name: biblora-secrets
      restartPolicy: Never