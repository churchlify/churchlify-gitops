apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biblora-admin-ingress
  namespace: biblora
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.biblora.cc
      secretName: biblora-admin-tls
  rules:
    - host: admin.biblora.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: biblora-admin
                port:
                  number: 80
