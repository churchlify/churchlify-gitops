apiVersion: v1
kind: Service
metadata:
  name: cvat
  namespace: sportif-ml
spec:
  selector:
    app: cvat
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: sportif-ml
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
