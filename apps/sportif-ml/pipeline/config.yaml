apiVersion: v1
kind: ConfigMap
metadata:
  name: sportif-ml-config
  namespace: sportif-ml
data:
  AWS_ENDPOINT_URL: http://minio-service.platform.svc.cluster.local:9000
  MLFLOW_S3_ENDPOINT_URL: http://minio-service.platform.svc.cluster.local:9000
  AWS_DEFAULT_REGION: us-east-1
  ML_RAW_BUCKET: sportif-ml-raw
  ML_FRAMES_BUCKET: sportif-ml-frames
  ML_DATASETS_BUCKET: sportif-ml-datasets
  ML_MODELS_BUCKET: sportif-ml-models
  ML_EXPERIMENTS_BUCKET: sportif-ml-experiments
  ML_PROVENANCE_BUCKET: sportif-ml-provenance
  FRAME_FPS: "3"
  FRAME_PHASH_THRESHOLD: "8"
  CVAT_API_URL: http://cvat-backend-service:8080
  DATASET_ID: sportif-ball-v001
  DATASET_SEED: "42"
  DATASET_APPROVED: "true"
  MODEL_ID: sportif-ball-detector-v001
  TRAINING_EPOCHS: "150"
  TRAINING_BATCH_SIZE: "2"
  TRAINING_IMAGE_SIZE: "1024"
  TRAINING_LEARNING_RATE: "0.001"
  TRAINING_VALIDATION_INTERVAL: "5"
  TRAINING_VALIDATION_SCORE_THRESHOLD: "0.05"
  TRAINING_EARLY_STOPPING_PATIENCE: "5"
  TRAINING_MIN_VALIDATION_IMPROVEMENT: "0.001"
  TRAINABILITY_IMAGE_COUNT: "4"
  TRAINABILITY_STEPS: "150"
  TRAINABILITY_LEARNING_RATE: "0.0005"
  TRAINABILITY_MIN_IOU: "0.75"
  TRAINABILITY_MIN_SCORE: "0.90"
  EVALUATION_SCORE_THRESHOLD: "0.05"
  EVALUATION_MIN_MAP50: "0.50"
  EVALUATION_MIN_MAP50_95: "0.20"
  EVALUATION_MIN_PRECISION: "0.60"
  EVALUATION_MIN_RECALL: "0.60"
