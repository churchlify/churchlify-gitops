# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/main/api/jsonschema/schema.json
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sportif-ball-pipeline
  namespace: sportif-ml
spec:
  serviceAccountName: sportif-ml-pipeline
  entrypoint: pipeline
  arguments:
    parameters:
      - name: video-key
        value: videos/input.mp4
      - name: provenance-key
        value: videos/input/source-provenance.json
      - name: dataset-id
        value: sportif-ball-v001
      - name: dataset-approved
        value: "false"
  templates:
    - name: pipeline
      dag:
        tasks:
          - name: validate-input
            template: validate-input
          - name: extract-frames
            dependencies: [validate-input]
            template: extract-frames
          - name: deduplicate
            dependencies: [extract-frames]
            template: deduplicate
          - name: prepare-dataset
            dependencies: [deduplicate]
            template: prepare-dataset
          - name: validate-dataset
            dependencies: [prepare-dataset]
            template: validate-dataset
          - name: dataset-approval
            dependencies: [validate-dataset]
            template: dataset-approval
          - name: train
            dependencies: [dataset-approval]
            template: train
          - name: evaluate
            dependencies: [train]
            template: evaluate
          - name: export-onnx
            dependencies: [evaluate]
            template: export-onnx

    - name: validate-input
      container:
        image: ghcr.io/agogos-llc/sportif-ball-trainer:0.1.0
        command: [python, -m, sportif_ml.provenance]
        args: [validate-input, "{{workflow.parameters.video-key}}"]
        envFrom:
          - configMapRef: { name: sportif-ml-config }
          - secretRef: { name: sportif-ml-storage }

    - name: extract-frames
      container:
        image: ghcr.io/agogos-llc/sportif-ball-trainer:0.1.0
        command: [python, -m, sportif_ml.extract_frames]
        args: ["{{workflow.parameters.video-key}}"]
        envFrom:
          - configMapRef: { name: sportif-ml-config }
          - secretRef: { name: sportif-ml-storage }

    - name: prepare-dataset
      container:
        image: ghcr.io/agogos-llc/sportif-ball-trainer:0.1.0
        command: [python, -m, sportif_ml.dataset]
        args: [prepare, "{{workflow.parameters.dataset-id}}"]
        envFrom:
          - configMapRef: { name: sportif-ml-config }
          - secretRef: { name: sportif-ml-storage }

    - name: deduplicate
      container:
        image: ghcr.io/agogos-llc/sportif-ml-worker@sha256:f8bf3b1eb61d2cee5cef69ecfcb5d6a41940f66d1fc80c19b40352a1494d09d8
        command: [python, -m, sportif_ml_worker]
        args:
          - deduplicate
          - --video-key
          - "{{workflow.parameters.video-key}}"
          - --provenance-key
          - "{{workflow.parameters.provenance-key}}"
        envFrom:
          - configMapRef: { name: sportif-ml-config }
          - secretRef: { name: sportif-ml-storage }

    - name: validate-dataset
      container:
        image: ghcr.io/agogos-llc/sportif-ball-trainer:0.1.0
        command: [python, -m, sportif_ml.dataset]
        args: [validate, "{{workflow.parameters.dataset-id}}"]
        envFrom:
          - configMapRef: { name: sportif-ml-config }
          - secretRef: { name: sportif-ml-storage }

    - name: dataset-approval
      script:
        image: python:3.12-slim
        command: [python]
        source: |
          import sys
          approved = "{{workflow.parameters.dataset-approved}}".lower() == "true"
          if not approved:
              raise SystemExit("dataset approval is required before training")
          print("dataset approved")

    - name: train
      container:
        image: ghcr.io/agogos-llc/sportif-ball-trainer:0.1.0
        command: [python, -m, sportif_ml.train]
        args: ["{{workflow.parameters.dataset-id}}"]
        envFrom:
          - configMapRef: { name: sportif-ml-config }
          - secretRef: { name: sportif-ml-storage }
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: 16Gi
            nvidia.com/gpu: "1"
        nodeSelector:
          accelerator: nvidia-v100

    - name: evaluate
      container:
        image: ghcr.io/agogos-llc/sportif-ball-trainer:0.1.0
        command: [python, -m, sportif_ml.evaluate]
        args: ["{{workflow.parameters.dataset-id}}"]
        envFrom:
          - configMapRef: { name: sportif-ml-config }
          - secretRef: { name: sportif-ml-storage }

    - name: export-onnx
      container:
        image: ghcr.io/agogos-llc/sportif-ball-trainer:0.1.0
        command: [python, -m, sportif_ml.export_onnx]
        args: ["{{workflow.parameters.dataset-id}}"]
        envFrom:
          - configMapRef: { name: sportif-ml-config }
          - secretRef: { name: sportif-ml-storage }
