# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/main/api/jsonschema/schema.json
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sportif-ball-training
  namespace: sportif-ml
  labels:
    app.kubernetes.io/component: ball-training
spec:
  serviceAccountName: sportif-ml-pipeline
  entrypoint: pipeline
  activeDeadlineSeconds: 604800
  synchronization:
    mutex:
      name: sportif-ball-training
  podGC:
    strategy: OnWorkflowSuccess
  ttlStrategy:
    secondsAfterCompletion: 604800
  podSpecPatch: |
    {"securityContext":{"runAsNonRoot":true,"runAsUser":10001,"runAsGroup":10001,"fsGroup":10001,"fsGroupChangePolicy":"OnRootMismatch","seccompProfile":{"type":"RuntimeDefault"}}}
  arguments:
    parameters:
      - name: dataset-id
        value: sportif-ball-v001
  volumes:
    - name: work
      persistentVolumeClaim:
        claimName: sportif-ml-work
    - name: tmp
      emptyDir:
        sizeLimit: 4Gi
  templates:
    - name: pipeline
      dag:
        tasks:
          - name: materialize-dataset
            template: trainer-two-args
            arguments:
              parameters:
                - name: module
                  value: sportif_ml.storage
                - name: argument-one
                  value: materialize
                - name: argument-two
                  value: "{{workflow.parameters.dataset-id}}"
          - name: validate-dataset
            dependencies: [materialize-dataset]
            template: trainer-two-args
            arguments:
              parameters:
                - name: module
                  value: sportif_ml.dataset
                - name: argument-one
                  value: validate
                - name: argument-two
                  value: "{{workflow.parameters.dataset-id}}"
          - name: verify-trainability
            dependencies: [validate-dataset]
            template: gpu-trainer
            arguments:
              parameters:
                - name: module
                  value: sportif_ml.trainability
                - name: argument
                  value: "{{workflow.parameters.dataset-id}}"
          - name: train
            dependencies: [verify-trainability]
            template: gpu-trainer
            arguments:
              parameters:
                - name: module
                  value: sportif_ml.train
                - name: argument
                  value: "{{workflow.parameters.dataset-id}}"
          - name: evaluate
            dependencies: [train]
            template: gpu-trainer
            arguments:
              parameters:
                - name: module
                  value: sportif_ml.evaluate
                - name: argument
                  value: "{{workflow.parameters.dataset-id}}"
          - name: export-onnx
            dependencies: [evaluate]
            template: trainer-one-arg
            arguments:
              parameters:
                - name: module
                  value: sportif_ml.export_onnx
                - name: argument
                  value: "{{workflow.parameters.dataset-id}}"
          - name: create-provenance
            dependencies: [export-onnx]
            template: trainer-two-args
            arguments:
              parameters:
                - name: module
                  value: sportif_ml.provenance
                - name: argument-one
                  value: release
                - name: argument-two
                  value: "{{workflow.parameters.dataset-id}}"
          - name: publish-candidate
            dependencies: [create-provenance]
            template: trainer-three-args
            arguments:
              parameters:
                - name: module
                  value: sportif_ml.storage
                - name: argument-one
                  value: publish
                - name: argument-two
                  value: "{{workflow.parameters.dataset-id}}"
                - name: argument-three
                  value: "{{workflow.name}}"

    - name: trainer-one-arg
      inputs:
        parameters:
          - name: module
          - name: argument
      nodeSelector:
        accelerator: nvidia-v100
      retryStrategy:
        limit: "1"
        retryPolicy: OnError
      container:
        image: ghcr.io/bjelugbo/sportif-ball-trainer@sha256:57069af234721ee2f2e7a0de20d28f9c3eb924b4ce34aa84ccabeb7e7b518295
        imagePullPolicy: IfNotPresent
        command: [python, -m, "{{inputs.parameters.module}}"]
        args: ["{{inputs.parameters.argument}}"]
        envFrom:
          - configMapRef:
              name: sportif-ml-config
          - secretRef:
              name: sportif-ml-storage
        env:
          - name: ML_WORK_DIR
            value: /work/{{workflow.uid}}
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 16Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: work
            mountPath: /work
          - name: tmp
            mountPath: /tmp

    - name: trainer-two-args
      inputs:
        parameters:
          - name: module
          - name: argument-one
          - name: argument-two
      nodeSelector:
        accelerator: nvidia-v100
      retryStrategy:
        limit: "1"
        retryPolicy: OnError
      container:
        image: ghcr.io/bjelugbo/sportif-ball-trainer@sha256:57069af234721ee2f2e7a0de20d28f9c3eb924b4ce34aa84ccabeb7e7b518295
        imagePullPolicy: IfNotPresent
        command: [python, -m, "{{inputs.parameters.module}}"]
        args:
          - "{{inputs.parameters.argument-one}}"
          - "{{inputs.parameters.argument-two}}"
        envFrom:
          - configMapRef:
              name: sportif-ml-config
          - secretRef:
              name: sportif-ml-storage
        env:
          - name: ML_WORK_DIR
            value: /work/{{workflow.uid}}
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 16Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: work
            mountPath: /work
          - name: tmp
            mountPath: /tmp

    - name: trainer-three-args
      inputs:
        parameters:
          - name: module
          - name: argument-one
          - name: argument-two
          - name: argument-three
      nodeSelector:
        accelerator: nvidia-v100
      retryStrategy:
        limit: "1"
        retryPolicy: OnError
      container:
        image: ghcr.io/bjelugbo/sportif-ball-trainer@sha256:57069af234721ee2f2e7a0de20d28f9c3eb924b4ce34aa84ccabeb7e7b518295
        imagePullPolicy: IfNotPresent
        command: [python, -m, "{{inputs.parameters.module}}"]
        args:
          - "{{inputs.parameters.argument-one}}"
          - "{{inputs.parameters.argument-two}}"
          - "{{inputs.parameters.argument-three}}"
        envFrom:
          - configMapRef:
              name: sportif-ml-config
          - secretRef:
              name: sportif-ml-storage
        env:
          - name: ML_WORK_DIR
            value: /work/{{workflow.uid}}
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 16Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: work
            mountPath: /work
          - name: tmp
            mountPath: /tmp

    - name: gpu-trainer
      inputs:
        parameters:
          - name: module
          - name: argument
      nodeSelector:
        accelerator: nvidia-v100
      podSpecPatch: |
        {"runtimeClassName":"nvidia"}
      container:
        image: ghcr.io/bjelugbo/sportif-ball-trainer@sha256:57069af234721ee2f2e7a0de20d28f9c3eb924b4ce34aa84ccabeb7e7b518295
        imagePullPolicy: IfNotPresent
        command: [python, -m, "{{inputs.parameters.module}}"]
        args: ["{{inputs.parameters.argument}}"]
        envFrom:
          - configMapRef:
              name: sportif-ml-config
          - secretRef:
              name: sportif-ml-storage
        env:
          - name: ML_WORK_DIR
            value: /work/{{workflow.uid}}
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: 24Gi
            nvidia.com/gpu: "1"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: work
            mountPath: /work
          - name: tmp
            mountPath: /tmp
