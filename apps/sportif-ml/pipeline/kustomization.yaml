apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - config.yaml
  - mlflow-dependencies.yaml
  - services.yaml
  - mlflow.yaml
  - workflows.yaml

# Stage 2 is active: MLflow uses the existing versioned ML buckets and the
# scoped sportif-ml-storage Secret created during Stage 1. Bucket creation is
# intentionally not managed here because the buckets are pre-provisioned.
# CVAT is deployed from its supported Helm chart. Stage 4B activates only the
# CPU video-ingest workflow. The full dataset/training workflow remains staged.
