apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - config.yaml
  - mlflow-dependencies.yaml
  - services.yaml
  - mlflow.yaml
  - workflows.yaml

# Stage 2 is active: MLflow uses the existing versioned ML buckets and the
# scoped sportif-ml-storage Secret created during Stage 1. Bucket creation is
# intentionally not managed here because the buckets are pre-provisioned.
# CVAT is deployed from its supported Helm chart. Stage 4C activates only the
# CPU video-ingest and deterministic frame selection. The separately submitted
# CVAT handoff workflow remains staged until its token and digest are ready.
# Dataset preparation and training also remain staged.
