apiVersion: batch/v1
kind: Job
metadata:
  name: sportif-ml-bucket-bootstrap
  namespace: sportif-ml
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: sportif-ml-bucket-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              mc alias set sportif "$AWS_ENDPOINT_URL" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
              for bucket in "$ML_RAW_BUCKET" "$ML_FRAMES_BUCKET" "$ML_DATASETS_BUCKET" "$ML_MODELS_BUCKET" "$ML_EXPERIMENTS_BUCKET" "$ML_PROVENANCE_BUCKET"; do
                mc mb --ignore-existing "sportif/$bucket"
                mc version enable "sportif/$bucket"
              done
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          envFrom:
            - configMapRef:
                name: sportif-ml-config
            - secretRef:
                name: sportif-ml-storage
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
