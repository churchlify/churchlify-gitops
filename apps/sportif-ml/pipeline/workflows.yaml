# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/main/api/jsonschema/schema.json
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sportif-video-ingest
  namespace: sportif-ml
  labels:
    app.kubernetes.io/component: video-ingest
spec:
  serviceAccountName: sportif-ml-pipeline
  entrypoint: pipeline
  activeDeadlineSeconds: 3600
  podGC:
    strategy: OnWorkflowCompletion
  ttlStrategy:
    secondsAfterCompletion: 86400
  arguments:
    parameters:
      - name: video-key
      - name: provenance-key
  volumes:
    - name: work
      emptyDir:
        sizeLimit: 10Gi
    - name: tmp
      emptyDir:
        sizeLimit: 256Mi
  templates:
    - name: pipeline
      dag:
        tasks:
          - name: validate-input
            template: worker
            arguments:
              parameters:
                - name: command
                  value: validate-input
          - name: extract-frames
            dependencies: [validate-input]
            template: worker
            arguments:
              parameters:
                - name: command
                  value: extract-frames

    - name: worker
      inputs:
        parameters:
          - name: command
      nodeSelector:
        kubernetes.io/os: linux
        node-role.kubernetes.io/worker: worker
      retryStrategy:
        limit: "2"
        retryPolicy: OnError
      container:
        image: ghcr.io/agogos-llc/sportif-ml-worker@sha256:7e23a3084ec2ababa26556fdb3a232f27a6ed5c43a999462a27b151c4fb2367e
        imagePullPolicy: IfNotPresent
        command: [python, -m, sportif_ml_worker]
        args:
          - "{{inputs.parameters.command}}"
          - --video-key
          - "{{workflow.parameters.video-key}}"
          - --provenance-key
          - "{{workflow.parameters.provenance-key}}"
        envFrom:
          - configMapRef:
              name: sportif-ml-config
          - secretRef:
              name: sportif-ml-storage
        env:
          - name: ML_WORK_DIR
            value: /work
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
            ephemeral-storage: 12Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: work
            mountPath: /work
          - name: tmp
            mountPath: /tmp
