apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvat
  namespace: sportif-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cvat
  template:
    metadata:
      labels:
        app: cvat
    spec:
      serviceAccountName: sportif-ml-pipeline
      containers:
        - name: cvat
          image: cvat/server:v2.45.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CVAT_POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: sportif-ml-storage
                  key: CVAT_POSTGRES_HOST
            - name: CVAT_POSTGRES_DBNAME
              value: cvat
            - name: CVAT_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sportif-ml-storage
                  key: CVAT_POSTGRES_USER
            - name: CVAT_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sportif-ml-storage
                  key: CVAT_POSTGRES_PASSWORD
            - name: CVAT_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: sportif-ml-storage
                  key: CVAT_REDIS_HOST
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /api/server/about
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
