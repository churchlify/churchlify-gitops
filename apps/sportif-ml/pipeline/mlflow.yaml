apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-backend
  namespace: sportif-ml
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: sportif-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-s3-dependencies
          image: ghcr.io/mlflow/mlflow:v2.18.0@sha256:09d25b0c80efa2c1dd4b5e4834a1a0ed861d6b1c2b43017ff99493bd5c6bb4ee
          imagePullPolicy: IfNotPresent
          command: [python, -m, pip, install]
          args:
            - --disable-pip-version-check
            - --no-cache-dir
            - --no-deps
            - --require-hashes
            - --target
            - /opt/mlflow-dependencies
            - --requirement
            - /requirements/requirements.txt
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: mlflow-dependencies
              mountPath: /opt/mlflow-dependencies
            - name: mlflow-s3-requirements
              mountPath: /requirements
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.18.0@sha256:09d25b0c80efa2c1dd4b5e4834a1a0ed861d6b1c2b43017ff99493bd5c6bb4ee
          imagePullPolicy: IfNotPresent
          command: [mlflow, server]
          args:
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --backend-store-uri
            - sqlite:////mlflow/mlflow.db
            - --default-artifact-root
            - s3://sportif-ml-experiments/mlruns
          envFrom:
            - configMapRef:
                name: sportif-ml-config
            - secretRef:
                name: sportif-ml-storage
          env:
            - name: PYTHONPATH
              value: /opt/mlflow-dependencies
          ports:
            - name: http
              containerPort: 5000
          volumeMounts:
            - name: backend
              mountPath: /mlflow
            - name: mlflow-dependencies
              mountPath: /opt/mlflow-dependencies
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: backend
          persistentVolumeClaim:
            claimName: mlflow-backend
        - name: mlflow-dependencies
          emptyDir: {}
        - name: mlflow-s3-requirements
          configMap:
            name: mlflow-s3-dependencies
        - name: tmp
          emptyDir: {}
