apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sportif-ml
  namespace: sportif-ml

resources:
  - namespace.yaml
  - namespace-scoped.yaml
  - training-config.yaml
  - storage.yaml
  - externalsecret.yaml
  - registry-externalsecret.yaml
  - cvat/externalsecrets.yaml
  - cvat/initializer-config.yaml
  - rbac.yaml
  - pipeline
  - cvat/automation-externalsecret-staged.yaml

labels:
  - pairs:
      app.kubernetes.io/name: sportif-ml
      app.kubernetes.io/part-of: sportif
      app.kubernetes.io/managed-by: argocd
