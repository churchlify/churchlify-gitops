apiVersion: v1
kind: ConfigMap
metadata:
  name: sportif-ball-training-config
  namespace: sportif-ml
data:
  training-config.yaml: |
    model:
      name: sportif-ball-detector
      version: v001
      classes:
        - ball
    initialization:
      type: random
      pretrainedWeights: false
    dataset:
      id: sportif-ball-v001
    training:
      epochs: 150
      batchSize: 2
      imageResize:
        minimumSide: 720
        maximumSide: 1280
        preserveAspectRatio: true
      seed: 42
      learningRate: 0.0002
      warmupEpochs: 5
      learningRateScheduler:
        type: reduce-on-validation-plateau
        factor: 0.5
        patience: 2
        minimumLearningRate: 0.000001
      gradientClipNorm: 5.0
      repeatedLossExplosionThreshold: 50.0
      balancedBatches: true
      sourceAwareSampling: true
      tinyPositiveReplayFactor: 4
      augmentation:
        trainingOnly: true
        zoomOutScale: [0.60, 1.00]
        horizontalFlipProbability: 0.50
        brightness: 0.15
        contrast: 0.15
        saturation: 0.10
        canvasValue: 114
        minimumPositiveObjectSidePixels: 8.0
      validationInterval: 5
      earlyStoppingPatience: 5
      minimumValidationImprovement: 0.001
      checkpointSelection:
        primary: best-validation-map50
        minimumTinyObjectRecall: 0.20
        tieBreakers: [tiny-object-recall, mAP50-95]
      operatingThresholdSelection:
        sourceSplit: validation
        minimum: 0.05
        maximum: 0.95
        step: 0.05
        minimumRecall: 0.20
        objective: maximum-f1
      validationReporting:
        perSource: true
        objectSizeRecallBandsPixels: [12, 24]
    trainabilitySmoke:
      images: 4
      steps: 150
      minimumIoU: 0.75
      minimumScore: 0.90
    anchors:
      sizes:
        - [4, 8, 16]
        - [8, 16, 32]
        - [16, 32, 64]
        - [32, 64, 128]
        - [64, 128, 256]
      aspectRatios: [0.5, 1.0, 2.0]
    compute:
      gpuCount: 1
    export:
      onnx: true
      representativeInput: 720x1280
      dynamicSpatialAxes: true
