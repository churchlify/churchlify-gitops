apiVersion: v1
kind: ConfigMap
metadata:
  name: sportif-ball-training-config
  namespace: sportif-ml
data:
  training-config.yaml: |
    model:
      name: sportif-ball-detector
      version: v001
      classes:
        - ball
    initialization:
      type: random
      pretrainedWeights: false
    dataset:
      id: sportif-ball-v001
    training:
      epochs: 150
      batchSize: 2
      imageSize: 1024
      seed: 42
      learningRate: 0.001
      balancedBatches: true
      validationInterval: 5
      earlyStoppingPatience: 5
      minimumValidationImprovement: 0.001
      checkpointSelection: best-validation-map
    trainabilitySmoke:
      images: 4
      steps: 150
      minimumIoU: 0.75
      minimumScore: 0.90
    anchors:
      sizes:
        - [4, 8, 16]
        - [8, 16, 32]
        - [16, 32, 64]
        - [32, 64, 128]
        - [64, 128, 256]
      aspectRatios: [0.5, 1.0, 2.0]
    compute:
      gpuCount: 1
    export:
      onnx: true
