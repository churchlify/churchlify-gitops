apiVersion: v1
kind: ServiceAccount
metadata:
  name: sportif-ml-pipeline
  namespace: sportif-ml
imagePullSecrets:
  - name: sportif-ml-registry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sportif-ml-pipeline
  namespace: sportif-ml
rules:
  # Argo's emissary executor reports task completion through this namespaced
  # resource. Pod creation and lifecycle are owned by the workflow controller,
  # not by the workflow ServiceAccount.
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sportif-ml-pipeline
  namespace: sportif-ml
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sportif-ml-pipeline
subjects:
  - kind: ServiceAccount
    name: sportif-ml-pipeline
    namespace: sportif-ml
