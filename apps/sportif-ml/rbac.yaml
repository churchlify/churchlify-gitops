apiVersion: v1
kind: ServiceAccount
metadata:
  name: sportif-ml-pipeline
  namespace: sportif-ml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sportif-ml-pipeline
  namespace: sportif-ml
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sportif-ml-pipeline
  namespace: sportif-ml
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sportif-ml-pipeline
subjects:
  - kind: ServiceAccount
    name: sportif-ml-pipeline
    namespace: sportif-ml
