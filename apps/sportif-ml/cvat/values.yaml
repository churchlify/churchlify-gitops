# Values for the supported CVAT v2.45.0 Helm chart (chart 0.17.0).
# The child Argo CD Application is discovered by platform-root. Its sync wave
# follows the namespace/foundation application, which owns the ExternalSecrets.

cvat:
  backend:
    image: cvat/server
    tag: v2.45.0
    imagePullPolicy: IfNotPresent
    affinity: &workerAffinity
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/worker
                  operator: In
                  values:
                    - worker
    initializer:
      # Run migrations before the application resources. Successful hooks are
      # deleted intentionally, so a missing initializer Job is healthy.
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
      additionalVolumes:
        - name: initializer-config
          configMap:
            name: cvat-initializer-config
            defaultMode: 0444
      additionalVolumeMounts:
        - name: initializer-config
          mountPath: /etc/cvat/init.d/10-no-analytics.sh
          subPath: 10-no-analytics.sh
          readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 2Gi
    additionalEnv:
      # CVAT's entrypoint reads this variable even when analytics is disabled.
      - name: CLICKHOUSE_HOST
        value: ""
    server:
      replicas: 1
    worker:
      export:
        replicas: 1
      import:
        replicas: 1
      chunks:
        replicas: 1
    defaultStorage:
      enabled: true
      storageClassName: longhorn
      accessModes:
        - ReadWriteMany
      size: 20Gi
  frontend:
    image: cvat/ui
    tag: v2.45.0
    imagePullPolicy: IfNotPresent
    replicas: 1
    affinity: *workerAffinity
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi

  opa:
    replicas: 1
    affinity: *workerAffinity
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi

  kvrocks:
    enabled: true
    affinity: *workerAffinity
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    defaultStorage:
      enabled: true
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      # Preserve the existing allocation. StatefulSet claim templates are
      # immutable, and the live PVC was originally provisioned at 100 GiB.
      size: 100Gi

# Reuse platform services. Do not deploy duplicate PostgreSQL or Redis.
postgresql:
  enabled: false
  external:
    host: pgsql-postgresql.platform.svc.cluster.local
    port: "5432"
  secret:
    create: false
    name: cvat-postgres-secret

redis:
  enabled: false
  external:
    host: redis-master.platform.svc.cluster.local
  auth:
    existingSecret: cvat-redis-secret
    existingSecretPasswordKey: password
  secret:
    create: false
    name: cvat-redis-secret

# The repository already has a monitoring stack boundary. Do not install the
# chart's bundled ClickHouse/Grafana analytics stack for the initial milestone.
analytics:
  enabled: false
clickhouse:
  enabled: false
nuclio:
  enabled: false
traefik:
  enabled: false

ingress:
  # Keep CVAT cluster-internal for the initial milestone. Enable ingress only
  # after an existing platform authentication pattern has been selected.
  enabled: false
  hostname: annotate.churchlify.com
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 2g
  tls: true
  tlsSecretName: sportif-ml-cvat-tls
