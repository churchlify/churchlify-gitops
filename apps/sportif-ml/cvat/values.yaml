# Staged values for the supported CVAT v2.45.0 Helm chart (chart 0.17.0).
# This file is not part of the active sportif-ml Kustomization. Activate it only
# after the shared PostgreSQL database/user, shared Redis credentials, and the
# CVAT ExternalSecrets described in docs/ml-factory/installation.md exist.

cvat:
  backend:
    # CVAT uses Longhorn-backed PVCs. Keep storage-backed components on
    # registered Longhorn nodes; reserve the GPU node for training.
    affinity: &longhornWorkerAffinity
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - k8s-worker-01
                    - k8s-worker-02
                    - k8s-worker-04
    image: cvat/server
    tag: v2.45.0
    imagePullPolicy: IfNotPresent
    server:
      affinity: *longhornWorkerAffinity
    worker:
      affinity: *longhornWorkerAffinity
    defaultStorage:
      enabled: true
      storageClassName: longhorn
      accessModes:
        - ReadWriteMany
      size: 20Gi
  frontend:
    affinity: *longhornWorkerAffinity
    image: cvat/ui
    tag: v2.45.0
    imagePullPolicy: IfNotPresent

  opa:
    affinity: *longhornWorkerAffinity

  kvrocks:
    affinity: *longhornWorkerAffinity

# Reuse platform services. Do not deploy duplicate PostgreSQL or Redis.
postgresql:
  enabled: false
  external:
    host: pgsql-postgresql.platform.svc.cluster.local
    port: "5432"
  secret:
    create: false
    name: cvat-postgres-secret

redis:
  enabled: false
  external:
    host: redis-master.platform.svc.cluster.local
  auth:
    existingSecret: cvat-redis-secret
    existingSecretPasswordKey: password
  secret:
    create: false
    name: cvat-redis-secret

# The repository already has a monitoring stack boundary. Do not install the
# chart's bundled ClickHouse/Grafana analytics stack for the initial milestone.
analytics:
  enabled: false
clickhouse:
  enabled: false
nuclio:
  enabled: false
traefik:
  enabled: false

ingress:
  enabled: true
  hostname: annotate.churchlify.com
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 2g
  tls: true
  tlsSecretName: sportif-ml-cvat-tls
