apiVersion: nuclio.io/v1beta1
kind: NuclioFunction
metadata:
  name: sportif-ball-detector
  namespace: sportif-ml
spec:
  runtime: python:3.11
  handler: main:handler
  imagePullSecrets: sportif-ml-registry
  # Keep the large Kaniko build away from the storage-constrained GPU node.
  nodeSelector:
    node-role.kubernetes.io/worker: worker
  build:
    # Nuclio prepends registry.pushPullUrl to this repository-relative name.
    image: nuclio-sportif-ball-detector:checkpoint-a175e107-nuclio-1.16.11
    baseImage: ghcr.io/bjelugbo/sportif-ball-trainer@sha256:87bc1b8d51584e465920cda193c078b32e6ecf1d1961453d1b787aac83338317
    directives:
      preCopy:
        - kind: USER
          value: root
      postCopy:
        - kind: USER
          value: "10001"