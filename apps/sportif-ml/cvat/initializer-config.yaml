apiVersion: v1
kind: ConfigMap
metadata:
  name: cvat-initializer-config
  namespace: sportif-ml
data:
  10-no-analytics.sh: |
    # CVAT 2.45's stock cmd_init always initializes ClickHouse, even when the
    # Helm chart has analytics disabled. Override only the initializer command;
    # the entrypoint sources this file after defining its stock functions.
    cmd_init() {
        wait_for_db
        ~/manage.py migrate

        wait_for_redis_inmem
        ~/manage.py migrateredis
        ~/manage.py syncperiodicjobs
    }
