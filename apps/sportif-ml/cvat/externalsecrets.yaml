apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cvat-postgres-sync
  namespace: sportif-ml
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: cvat-postgres-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database: "cvat"
        username: "{{ .PGSQL_USER }}"
        password: "{{ .PGSQL_PASSWORD }}"
  data:
    - secretKey: PGSQL_USER
      remoteRef:
        key: global-db-secrets
        property: PGSQL_USER
    - secretKey: PGSQL_PASSWORD
      remoteRef:
        key: global-db-secrets
        property: PGSQL_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cvat-redis-sync
  namespace: sportif-ml
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: cvat-redis-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .REDIS_PASSWORD }}"
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: global-db-secrets
        property: REDIS_PASSWORD
