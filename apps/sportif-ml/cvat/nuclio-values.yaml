# Nuclio chart 0.22.11 / application 1.16.11.
# Installed as a source of the sportif-ml-cvat Argo CD Application with release
# name `cvat`, preserving the CVAT chart's expected dashboard Service name.
controller:
  nodeSelector:
    node-role.kubernetes.io/worker: worker
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi

dashboard:
  nodeSelector:
    node-role.kubernetes.io/worker: worker
  containerBuilderKind: kaniko
  monitorDockerDeamon:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
  ingress:
    enabled: false

registry:
  pushPullUrl: ghcr.io/bjelugbo
  runRegistryURL: ghcr.io/bjelugbo
  loginUrl: ghcr.io
  secretName: sportif-ml-registry
  kind: offCluster

rbac:
  create: true
  crdAccessMode: namespaced

crd:
  create: true

platform:
  kube:
    defaultServiceType: ClusterIP
    defaultHTTPIngressHostTemplate: ""
  functionReadinessTimeout: 10m
  functionInvocationTimeout: 5m