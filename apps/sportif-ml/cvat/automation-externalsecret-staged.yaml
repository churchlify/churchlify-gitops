# Staged until the operator creates the non-admin CVAT automation account and
# adds CVAT_API_TOKEN to global-db-secrets. Add this file to the root
# kustomization only after that manual prerequisite is complete.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sportif-ml-cvat-automation-sync
  namespace: sportif-ml
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: sportif-ml-cvat-automation
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CVAT_API_TOKEN: "{{ .CVAT_API_TOKEN }}"
  data:
    - secretKey: CVAT_API_TOKEN
      remoteRef:
        key: global-db-secrets
        property: CVAT_API_TOKEN