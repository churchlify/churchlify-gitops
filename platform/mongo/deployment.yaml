---
# 1. Map the Global Secrets to the Local Namespace
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-passwords
  namespace: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: mongodb
  data:
  - secretKey: mongodb-root-password
    remoteRef:
      key: global-db-secrets
      property: MONGO_ROOT_PASSWORD
  - secretKey: mongodb-replica-set-key
    remoteRef:
      key: global-db-secrets
      property: MONGO_REPLICA_SET_KEY

---
# 2. Headless Service (REQUIRED)
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: platform
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017

---
# 3. MongoDB StatefulSet (FIXED)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: platform
spec:
  serviceName: mongodb-headless
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      terminationGracePeriodSeconds: 30

      initContainers:
      - name: volume-permissions
        image: busybox:latest
        command: ["sh", "-c", "chown -R 1001:1001 /bitnami/mongodb"]
        volumeMounts:
        - name: datadir
          mountPath: /bitnami/mongodb

      securityContext:
        fsGroup: 1001

      containers:
      - name: mongodb
        image: bitnami/mongodb:latest
        ports:
        - containerPort: 27017
          name: mongodb

        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        - name: MONGODB_ADVERTISED_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        - name: MONGODB_REPLICA_SET_NAME
          value: "rs0"

        - name: MONGODB_INITIAL_PRIMARY_HOST
          value: "mongodb-0.mongodb-headless.platform.svc.cluster.local"

        - name: MONGODB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb
              key: mongodb-root-password

        - name: MONGODB_REPLICA_SET_KEY
          valueFrom:
            secretKeyRef:
              name: mongodb
              key: mongodb-replica-set-key

        command:
        - /bin/bash
        - -c
        - |
          echo "Pod name: $POD_NAME"

          if [[ "$POD_NAME" == "mongodb-0" ]]; then
            export MONGODB_REPLICA_SET_MODE=primary
            echo "Configuring as PRIMARY"
          else
            export MONGODB_REPLICA_SET_MODE=secondary
            export MONGODB_INITIAL_PRIMARY_ROOT_PASSWORD="$MONGODB_ROOT_PASSWORD"
            unset MONGODB_ROOT_PASSWORD
            echo "Configuring as SECONDARY"
          fi

          exec /opt/bitnami/scripts/mongodb/entrypoint.sh /opt/bitnami/scripts/mongodb/run.sh

        volumeMounts:
        - name: datadir
          mountPath: /bitnami/mongodb

  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "longhorn"
      resources:
        requests:
          storage: 20Gi