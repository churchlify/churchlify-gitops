apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sportif-ml-argo-workflows
  namespace: argocd
  annotations:
    # The Sportif ML namespace and executor ServiceAccount/RBAC are owned by the
    # foundation Application and must exist before the controller starts.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/part-of: sportif-ml
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-workflows
      targetRevision: 0.45.20
      helm:
        releaseName: sportif-ml-argo-workflows
        valueFiles:
          - $values/apps/sportif-ml/argo-workflows/values.yaml
    - repoURL: https://github.com/churchlify/churchlify-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sportif-ml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
