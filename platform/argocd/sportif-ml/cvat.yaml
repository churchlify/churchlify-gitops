apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sportif-ml-cvat
  namespace: argocd
  annotations:
    # platform-root recursively discovers this child Application. Sync it only
    # after the foundation Application has created the namespace and secrets.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: cvat
    app.kubernetes.io/part-of: sportif-ml
spec:
  project: default
  sources:
    - repoURL: https://github.com/cvat-ai/cvat.git
      targetRevision: 125dd1e7006e7aadd8249c1256ec3a8945fcb191
      path: helm-chart
      helm:
        releaseName: cvat
        valueFiles:
          - $values/apps/sportif-ml/cvat/values.yaml
    - repoURL: https://github.com/churchlify/churchlify-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sportif-ml
  ignoreDifferences:
    # The existing KVrocks StatefulSet was created with a 100 GiB claim template
    # before storageClassName was explicit. Kubernetes forbids mutating claim
    # templates. Ignore only this immutable field; pod-template drift continues
    # to reconcile normally.
    - group: apps
      kind: StatefulSet
      name: cvat-kvrocks
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
