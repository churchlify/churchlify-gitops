apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/churchlify/churchlify-gitops.git'
    targetRevision: HEAD
    path: infrastructure
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: metallb-system # Or default, since the YAMLs specify namespaces
  syncPolicy:
    automated:
      prune: true
      selfHeal: true