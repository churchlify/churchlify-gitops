apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sportif-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sportif
    app: sportif-platform

spec:
  project: default

  source:
    repoURL: https://github.com/agogos-llc/sportif.git # Update to your repo
    targetRevision: main
    path: manifest # Root kustomization that includes enabled chunks

  destination:
    server: https://kubernetes.default.svc
    namespace: sports-tracking

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
