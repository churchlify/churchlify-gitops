apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sport-track-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/churchlify/churchlify-gitops.git
    path: apps/sport-track/web/overlays/production
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: sports-tracking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
