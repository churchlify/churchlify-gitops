apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama-infra
  namespace: argocd
spec:
  project: default
  source:
    # Replace with your actual Git repository URL
    repoURL: "https://github.com/churchlify/churchlify-gitops.git"
    targetRevision: HEAD
    path: apps/ollama/overlays/production # The folder where you saved the manifests
  destination:
    server: "https://kubernetes.default.svc"
    namespace: qe-infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # Automatically creates qe-infra if missing
      - RespectIgnoreDifferences=true
