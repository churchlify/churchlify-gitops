# Parallel verification app for the api/queue-worker/notifications split.
# See apps/sportif_v2/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sportif-v2
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: sportif-v2
    app: sportif-v2

spec:
  project: default

  source:
    repoURL: https://github.com/churchlify/churchlify-gitops.git
    path: apps/sportif_v2
    targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: sports-tracking

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
