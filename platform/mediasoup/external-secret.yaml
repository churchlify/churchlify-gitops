apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediasoup-secret-sync
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: mediasoup-secrets
    creationPolicy: Merge
  data:
    - secretKey: MEDIASOUP_ANNOUNCED_IP
      remoteRef:
        key: global-db-secrets
        property: MEDIASOUP_ANNOUNCED_IP
