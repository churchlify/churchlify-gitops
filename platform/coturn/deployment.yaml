apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      hostNetwork: true # Recommended for TURN to avoid NAT issues with UDP ranges
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: coturn
        image: coturn/coturn:4.6.2-alpine
        ports:
        - containerPort: 3478
          protocol: UDP
          name: turn-udp
        - containerPort: 3478
          protocol: TCP
          name: turn-tcp
        - containerPort: 5349
          protocol: TCP
          name: turns-tcp
        env:
        - name: TURN_SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: coturn-secrets
              key: TURN_SECRET
        - name: TURN_REALM
          value: "turn.churchlify.local"
        - name: TURN_MIN_PORT
          value: "49160"
        - name: TURN_MAX_PORT
          value: "49200"
        volumeMounts:
        - name: coturn-tls
          mountPath: /etc/coturn/tls
          readOnly: true
        command: ["/bin/sh", "-c"]
        args:
          - |
            exec turnserver \
              --listening-port=3478 \
              --tls-listening-port=5349 \
              --cert=/etc/coturn/tls/tls.crt \
              --pkey=/etc/coturn/tls/tls.key \
              --min-port=${TURN_MIN_PORT} \
              --max-port=${TURN_MAX_PORT} \
              --realm=${TURN_REALM} \
              --use-auth-secret \
              --static-auth-secret=${TURN_SHARED_SECRET} \
              --fingerprint \
              --no-cli \
              --log-file=stdout
      volumes:
      - name: coturn-tls
        secret:
          secretName: coturn-tls